<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>顺畅肠道日记</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap">
<style>
/* Layout: a single phone-shaped app shell (full-bleed on phones, framed on desktop) with a scrolling screen and a bottom tab bar. */
:root {
  --bg: #E3E3E9;
  --frame: #F2F2F7;
  --surface: #FFFFFF;
  --fill: #F2F2F7;
  --seg-on: #FFFFFF;
  --ink: #1C1C1E;
  --muted: #8A8A8E;
  --line: #E5E5EA;
  --accent: #14A085;
  --accent-ink: #FFFFFF;
  --accent-soft: #DDF3EE;
  --perfect: #5856D6;
  --good: #3478F6;
  --fine: #2FA8DF;
  --ok: #F2784B;
  --bad: #E5383B;
  --bad-soft: #FFECEB;
  --warn-soft: #FFF0EA;
  --stool: #7A4A26;
  --shadow: 0 20px 60px rgba(0, 0, 0, .14);
  --f-display: -apple-system, "SF Pro Display", "SF Pro Rounded", system-ui, "PingFang SC", "Noto Sans SC", sans-serif;
  --f-body: -apple-system, "SF Pro Text", system-ui, "PingFang SC", "Noto Sans SC", "Microsoft YaHei", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111113; --frame: #000000; --surface: #1C1C1E; --fill: #2C2C2E; --seg-on: #636366; --ink: #FFFFFF; --muted: #8E8E93;
    --line: #38383A; --accent: #2FD1B0; --accent-ink: #00261E; --accent-soft: #10332C;
    --perfect: #8A87FF; --good: #4A90FF; --fine: #64D2FF; --ok: #FF9A70; --bad: #FF5A52; --bad-soft: #3A1A18; --warn-soft: #3A2219;
    --stool: #B27B4F; --shadow: 0 20px 60px rgba(0, 0, 0, .6); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111113; --frame: #000000; --surface: #1C1C1E; --fill: #2C2C2E; --seg-on: #636366; --ink: #FFFFFF; --muted: #8E8E93;
  --line: #38383A; --accent: #2FD1B0; --accent-ink: #00261E; --accent-soft: #10332C;
  --perfect: #8A87FF; --good: #4A90FF; --fine: #64D2FF; --ok: #FF9A70; --bad: #FF5A52; --bad-soft: #3A1A18; --warn-soft: #3A2219;
  --stool: #B27B4F; --shadow: 0 20px 60px rgba(0, 0, 0, .6); color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.55;
  display: flex; justify-content: center; align-items: center; overflow: hidden;
}
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.phone {
  position: relative; display: flex; flex-direction: column; width: 100%; height: 100%;
  background: var(--frame); overflow: hidden;
}
@media (min-width: 560px) {
  .phone { width: 400px; height: min(840px, calc(100% - 40px)); border-radius: 40px; border: 1px solid var(--line); box-shadow: var(--shadow); }
}
.screen { flex: 1; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; }
.pad {
  display: flex; flex-direction: column; gap: 14px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 18px 110px;
}

/* type */
h1, h2, h3, p { margin: 0; }
h1 { font-size: 24px; font-weight: 700; text-wrap: balance; letter-spacing: -.01em; }
h2 { font-size: 15px; font-weight: 700; }
.eyebrow { font-size: 12px; color: var(--muted); letter-spacing: .06em; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.num { font-family: var(--f-display); font-variant-numeric: tabular-nums; }

.hello { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; }
.brand { font-family: var(--f-display); font-weight: 800; font-size: 13px; letter-spacing: .08em; color: var(--accent); display: inline-flex; align-items: center; gap: 6px; }
.brand svg { width: 22px; height: 22px; }

.card { background: var(--surface); border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.card-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.link { background: none; border: 0; padding: 0; color: var(--accent); font-size: 13px; font-weight: 500; }

/* apple-health-like grouping */
.pad.home { gap: 26px; }
.group { display: flex; flex-direction: column; gap: 8px; }
.sec-title { display: flex; justify-content: space-between; align-items: baseline; padding: 0 4px; }
.sec-title h2 { font-size: 21px; font-weight: 700; letter-spacing: -.01em; }
.hello h1 { font-size: 32px; letter-spacing: -.02em; }
.cap { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 13px; }
.cap-label { color: var(--accent); font-weight: 600; display: inline-flex; gap: 6px; align-items: center; }
.cap-label svg { width: 16px; height: 16px; }
.cap .chev { color: var(--muted); display: inline-flex; align-items: center; gap: 2px; background: none; border: 0; padding: 0; font-size: 13px; }
.kpi { display: flex; align-items: baseline; gap: 3px; }
.kpi-num { font-family: var(--f-display); font-size: 34px; font-weight: 700; letter-spacing: -.02em; line-height: 1.1; font-variant-numeric: tabular-nums; }
.kpi-unit { font-size: 15px; color: var(--muted); font-weight: 600; }
.score-row { display: grid; grid-template-columns: auto 1fr; gap: 18px; align-items: center; }
.score-text { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.ring.xl { width: 184px; height: 184px; }
.ring.xl .big { font-size: 60px; }
.ring .of { font-size: 12px; font-weight: 600; }
.contribs { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 16px; padding-top: 4px; border-top: 1px solid var(--line); padding-block: 14px 2px; }
.contribs.full { grid-template-columns: 1fr; }
.contrib { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.c-top { display: flex; justify-content: space-between; align-items: baseline; gap: 6px; font-size: 14px; font-weight: 600; }
.c-lvl { font-size: 12px; font-weight: 500; color: var(--muted); }
.c-w { font-size: 11px; font-weight: 400; color: var(--muted); }
.c-bar { height: 6px; border-radius: 999px; background: var(--fill); overflow: hidden; }
.c-bar i { display: block; height: 100%; border-radius: inherit; }
.c-sub { display: flex; justify-content: space-between; gap: 6px; font-size: 12px; color: var(--muted); }
.c-sub span:first-child { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.segctl { display: grid; grid-template-columns: 1fr 1fr; background: var(--fill); border-radius: 9px; padding: 2px; }
.segctl button { border: 0; background: none; border-radius: 7px; padding: 5px 0; font-size: 13px; font-weight: 600; }
.segctl button[aria-selected="true"] { background: var(--seg-on); box-shadow: 0 1px 3px rgba(0,0,0,.14); }
.lchart { width: 100%; height: auto; display: block; overflow: visible; }
.lchart .grid { stroke: var(--line); stroke-width: 1; }
.lchart .ax { fill: var(--muted); font-size: 10px; font-family: var(--f-body); }
.lchart .line { fill: none; stroke: var(--good); stroke-width: 2.2; stroke-linejoin: round; stroke-linecap: round; }
.lchart .area { fill: var(--good); opacity: .1; }
.lchart .avg { stroke: var(--muted); stroke-dasharray: 3 3; stroke-width: 1; }
.lchart .dot { stroke: var(--surface); stroke-width: 1.5; }
.today-strip { display: flex; flex-direction: column; gap: 8px; border-top: 1px solid var(--line); padding-top: 12px; }
.ts-head { display: flex; justify-content: space-between; align-items: baseline; font-size: 14px; }
.ts-list { display: flex; flex-wrap: wrap; gap: 6px; }
.ts-item { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; background: var(--fill); border-radius: 8px; padding: 3px 8px; font-variant-numeric: tabular-nums; }
.ts-item i { width: 8px; height: 8px; border-radius: 50%; }
.day .cnt { position: absolute; top: 3px; left: 4px; font-size: 9px; font-weight: 700; line-height: 1; }
.wcnt { font-size: 10px; color: var(--muted); line-height: 1; }
.notice { display: flex; flex-direction: column; gap: 4px; background: var(--accent-soft); border-radius: 14px; padding: 12px 14px; font-size: 13px; }
.ok-note { display: flex; gap: 10px; align-items: center; font-size: 13px; }
.ok-note svg { width: 20px; height: 20px; color: var(--good); flex: none; }

/* avatar + settings */
.hello-left { display: flex; align-items: center; gap: 12px; min-width: 0; }
.avatar { width: 42px; height: 42px; border-radius: 15px; border: 0; background: var(--surface); color: var(--accent); display: grid; place-items: center; font-weight: 700; font-size: 17px; flex: none; padding: 0; }
.avatar svg { width: 22px; height: 22px; }
.avatar.lg { width: 54px; height: 54px; border-radius: 18px; background: var(--accent-soft); font-size: 22px; }
.profile { flex-direction: row; align-items: center; gap: 14px; }
.grow { flex: 1; min-width: 0; }
.input { display: flex; align-items: center; gap: 8px; border: 1.5px solid var(--line); border-radius: 14px; padding: 0 12px; background: var(--fill); flex: 1; min-width: 0; }
.input:focus-within { border-color: var(--accent); }
.input span { color: var(--muted); font-size: 14px; }
.input input { border: 0; background: none; padding: 12px 0; width: 100%; min-width: 0; outline: none; }
.code-row { display: flex; gap: 8px; }
.code-row .btn { flex: none; padding: 0 14px; font-size: 14px; font-weight: 500; }
.agree { display: flex; gap: 8px; align-items: flex-start; font-size: 12px; color: var(--muted); }
.agree input { margin: 3px 0 0; accent-color: var(--accent); }
.err { color: var(--bad); }
.or { display: flex; align-items: center; gap: 10px; font-size: 12px; color: var(--muted); }
.or::before, .or::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.inline-input { border: 1px solid var(--line); background: var(--fill); border-radius: 10px; padding: 6px 10px; font-size: 14px; width: 150px; max-width: 55%; text-align: right; }
.mini-seg { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.chip { border: 1.5px solid var(--line); background: var(--surface); border-radius: 999px; padding: 3px 12px; font-size: 13px; }
.chip[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); font-weight: 700; }
.stepper { display: flex; align-items: center; gap: 10px; flex: none; }
.stepper .num { font-size: 18px; font-weight: 800; min-width: 22px; text-align: center; }
.icon-btn.sm { width: 32px; height: 32px; border-radius: 10px; background: var(--fill); font-size: 18px; font-weight: 700; }
.btn.danger { background: var(--bad); color: var(--surface); }
.btn.danger-text { color: var(--bad); }
.confirm { display: flex; flex-direction: column; gap: 10px; }
.thumb.type { font-size: 12px; font-weight: 700; }

/* banners */
.banner { display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: 16px; font-size: 13px; }
.banner.example { background: var(--accent-soft); }
.banner .grow { flex: 1; min-width: 0; }
.alert { border-radius: 20px; padding: 14px 16px; display: flex; flex-direction: column; gap: 6px; }
.alert.urgent { background: var(--bad-soft); border: 1px solid color-mix(in srgb, var(--bad) 35%, transparent); }
.alert.warn { background: var(--warn-soft); border: 1px solid color-mix(in srgb, var(--ok) 35%, transparent); }
.alert.info { background: var(--accent-soft); }
.alert-title { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 14px; }
.alert.urgent .alert-title { color: var(--bad); }
.alert.warn .alert-title { color: var(--ok); }
.alert.info .alert-title { color: var(--accent); }
.alert p { font-size: 13px; }
.pill { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 500; padding: 2px 10px; border-radius: 999px; white-space: nowrap; }
.pill.good { background: color-mix(in srgb, var(--good) 16%, transparent); color: var(--good); }
.pill.perfect { background: color-mix(in srgb, var(--perfect) 16%, transparent); color: var(--perfect); }
.pill.fine { background: color-mix(in srgb, var(--fine) 18%, transparent); color: var(--fine); }
.pill.ok { background: color-mix(in srgb, var(--ok) 18%, transparent); color: var(--ok); }
.pill.bad { background: color-mix(in srgb, var(--bad) 16%, transparent); color: var(--bad); }

/* score ring */
.hero { display: grid; grid-template-columns: auto 1fr; gap: 18px; align-items: center; }
.ring { position: relative; width: 132px; height: 132px; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring .track { fill: none; stroke: var(--line); }
.ring .val { fill: none; stroke-linecap: round; transition: stroke-dashoffset .9s cubic-bezier(.2,.8,.2,1); }
.ring .center { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
.ring .big { font-family: var(--f-display); font-weight: 800; font-size: 44px; line-height: 1; letter-spacing: -.02em; }
.ring .of { font-size: 11px; color: var(--muted); }
.hero-meta { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.chips-inline { display: flex; flex-wrap: wrap; gap: 6px; }
.tag { font-size: 12px; padding: 2px 8px; border-radius: 8px; background: var(--fill); color: var(--muted); }

.empty-hero { display: flex; flex-direction: column; gap: 10px; align-items: flex-start; }
.btn { border: 0; border-radius: 16px; padding: 13px 18px; font-weight: 700; font-size: 15px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
.btn.primary { background: var(--accent); color: var(--accent-ink); }
.btn.ghost { background: var(--surface); color: var(--ink); border: 1px solid var(--line); }
.btn.block { width: 100%; }
.btn:disabled { opacity: .45; cursor: not-allowed; }

/* week bars */
.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; align-items: end; height: 120px; }
.wcol { display: flex; flex-direction: column; align-items: center; gap: 6px; height: 100%; justify-content: flex-end; }
.wbar { width: 100%; max-width: 26px; border-radius: 8px 8px 4px 4px; min-height: 4px; }
.wbar.none { background: var(--line); }
.wlab { font-size: 11px; color: var(--muted); }
.wval { font-size: 11px; font-family: var(--f-display); font-weight: 600; font-variant-numeric: tabular-nums; }
.wcol.today .wlab { color: var(--ink); font-weight: 700; }

/* record list */
.rows { display: flex; flex-direction: column; }
.row { display: grid; grid-template-columns: 44px 1fr auto; gap: 12px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); }
.row:first-child { border-top: 0; padding-top: 0; }
.thumb { width: 44px; height: 44px; border-radius: 12px; background: var(--fill); object-fit: cover; display: grid; place-items: center; color: var(--stool); overflow: hidden; }
.thumb svg { width: 32px; }
.row-main { min-width: 0; }
.row-title { font-size: 14px; font-weight: 500; }
.row-sub { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.score-badge { font-family: var(--f-display); font-weight: 800; font-size: 20px; font-variant-numeric: tabular-nums; }

/* toggles */
.setting { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.setting + .setting { border-top: 1px solid var(--line); padding-top: 12px; }
.setting input[type="time"] { border: 1px solid var(--line); background: var(--fill); border-radius: 10px; padding: 4px 8px; font-size: 13px; }
.switch { position: relative; width: 46px; height: 28px; flex: none; }
.switch input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
.switch span { position: absolute; inset: 0; border-radius: 999px; background: var(--line); transition: background .2s; pointer-events: none; }
.switch span::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: var(--surface); box-shadow: 0 1px 3px rgba(0,0,0,.2); transition: transform .2s; }
.switch input:checked + span { background: var(--accent); }
.switch input:checked + span::after { transform: translateX(18px); }
.switch input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }

/* top bar for sub screens */
.topbar { display: flex; align-items: center; gap: 8px; }
.icon-btn { width: 38px; height: 38px; border-radius: 12px; border: 0; background: var(--surface); display: grid; place-items: center; flex: none; }
.icon-btn svg { width: 20px; height: 20px; }

/* record form */
.photo { position: relative; border-radius: 22px; background: var(--surface); border: 1.5px dashed color-mix(in srgb, var(--accent) 45%, var(--line)); overflow: hidden; }
.photo label { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; min-height: 190px; padding: 16px; cursor: pointer; text-align: center; }
.photo img { width: 100%; height: 220px; object-fit: cover; display: block; }
.photo .cam { width: 58px; height: 58px; border-radius: 18px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; }
.photo .cam svg { width: 28px; height: 28px; }
.photo .retake { position: absolute; right: 10px; bottom: 10px; background: rgba(0,0,0,.55); color: #fff; border: 0; border-radius: 12px; padding: 6px 12px; font-size: 13px; }
.photo .detect { position: absolute; left: 10px; top: 10px; background: rgba(0,0,0,.55); color: #fff; border-radius: 10px; padding: 4px 10px; font-size: 12px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.sample-link { align-self: center; }

.field { display: flex; flex-direction: column; gap: 10px; }
.field-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.colors { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.opt { border: 1.5px solid var(--line); background: var(--surface); border-radius: 14px; padding: 9px 10px; display: flex; align-items: center; gap: 8px; font-size: 13px; text-align: left; position: relative; }
.opt[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); font-weight: 700; }
.swatch { width: 16px; height: 16px; border-radius: 50%; flex: none; box-shadow: inset 0 0 0 1px rgba(0,0,0,.12); }
.auto { position: absolute; top: -8px; right: 6px; font-size: 10px; background: var(--accent); color: var(--accent-ink); border-radius: 6px; padding: 0 5px; line-height: 16px; }

.types { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
.types .opt { flex-direction: column; align-items: flex-start; gap: 2px; padding: 10px 12px; }
.types .opt svg { width: 48px; height: 26px; color: var(--stool); }
.types .t-name { font-size: 13px; }
.types .t-tag { font-size: 11px; color: var(--muted); font-weight: 400; }
.type-desc { font-size: 12px; color: var(--muted); }

.glasses { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
.glass { border: 0; background: none; padding: 2px; color: var(--line); display: grid; place-items: center; }
.glass svg { width: 100%; max-width: 38px; height: 40px; }
.glass.on { color: var(--accent); }
.water-read { display: flex; align-items: baseline; gap: 6px; }
.water-read .num { font-size: 28px; font-weight: 800; }

.seg { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.seg .opt { flex-direction: column; justify-content: center; text-align: center; gap: 4px; padding: 10px 4px; }
.seg .face { font-size: 0; width: 30px; height: 30px; }

.sticky-cta { position: absolute; left: 0; right: 0; bottom: 0; padding: 12px max(16px, env(safe-area-inset-right, 0px)) calc(14px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); background: linear-gradient(to top, var(--frame) 70%, transparent); z-index: 5; }
.hint { font-size: 12px; color: var(--muted); text-align: center; margin-top: 6px; }

/* result */
.result-hero { display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center; padding-block: 8px; }
.result-hero .ring { width: 170px; height: 170px; }
.result-hero .ring .big { font-size: 58px; }
.breakdown { display: flex; flex-direction: column; gap: 12px; }
.bk { display: grid; grid-template-columns: 74px 1fr 52px; gap: 10px; align-items: center; font-size: 13px; }
.bk-track { height: 8px; border-radius: 999px; background: var(--fill); overflow: hidden; }
.bk-fill { height: 100%; border-radius: inherit; }
.bk-val { text-align: right; font-family: var(--f-display); font-weight: 600; font-variant-numeric: tabular-nums; }
.bk-val small { color: var(--muted); font-weight: 400; }
.tips { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 10px; }
.tips li { display: grid; grid-template-columns: 22px 1fr; gap: 8px; font-size: 14px; }
.tips li::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); margin: 8px 0 0 6px; }
.doctor { margin: 4px 0 0; padding-left: 18px; font-size: 13px; display: flex; flex-direction: column; gap: 2px; }
.row-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

/* calendar */
.cal-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.cal-head h1 { font-size: 22px; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stat { background: var(--surface); border-radius: 16px; padding: 10px 12px; }

<body>

<div class="phone" id="phone">
  <main class="screen" id="screen" aria-live="polite"></main>
  <nav class="tabbar" aria-label="主导航">

</div>

<script>
(function () {
  "use strict";

  /* ---------- scoring model ---------- */
  var COLORS = {
    brown:  { name: "棕色",   hex: "#7A4A26", pts: 25, note: "健康的正常颜色" },
    yellow: { name: "黄色",   hex: "#C99A2E", pts: 18, note: "可能与高脂饮食或肠道通过较快有关" },
    green:  { name: "绿色",   hex: "#5F7B2C", pts: 16, note: "常见于绿叶菜摄入多或肠道通过过快" },
    black:  { name: "黑色",   hex: "#241C18", pts: 4,  note: "可能提示上消化道出血；补铁剂、铋剂也会导致发黑" },
    red:    { name: "带血/红色", hex: "#A3291F", pts: 0,  note: "可能提示下消化道出血或痔疮；红心火龙果、甜菜也会染红" },
    pale:   { name: "灰白色", hex: "#D3CAB3", pts: 4,  note: "可能与胆汁排出受阻有关" }
  };
  var TYPES = [null,
    { name: "分离硬块",   tag: "严重便秘", desc: "像坚果一样一颗颗的硬块，很难排出", pts: 10 },
    { name: "块状腊肠",   tag: "轻度便秘", desc: "香肠状，但表面凹凸成块",           pts: 24 },
    { name: "有裂纹的腊肠", tag: "正常",   desc: "香肠状，表面有些裂纹",             pts: 37 },
    { name: "光滑软条",   tag: "理想",     desc: "像香蕉一样光滑、柔软",             pts: 40 },
    { name: "软团块",     tag: "偏软",     desc: "边缘清楚的软块，很容易排出",       pts: 30 },
    { name: "糊状",       tag: "轻度腹泻", desc: "边缘蓬松、不成形的糊状",           pts: 16 },
    { name: "水样",       tag: "腹泻",     desc: "完全是液体，没有固体",             pts: 6 }
  ];
  var EFFORT = {
    easy:  { name: "很轻松",   pts: 20, face: "smile" },
    normal:{ name: "还行",     pts: 16, face: "flat" },
    hard:  { name: "有点费劲", pts: 8,  face: "strain" },
    vhard: { name: "非常费劲", pts: 3,  face: "pain" }
  };
  var CUP_ML = 250;
  function goal() { return (state && state.profile && state.profile.waterGoal) || 8; }
  function waterPts(c) { var g = goal(); return c >= g ? 15 : c >= g * 0.75 ? 12 : c >= g * 0.5 ? 8 : 3; }
  function scoreOf(r) {
    return TYPES[r.type].pts + COLORS[r.color].pts + EFFORT[r.effort].pts + waterPts(r.water);
  }
  function band(s) {
    if (s >= 95) return { label: "完美", cls: "perfect", color: "var(--perfect)" };
    if (s >= 80) return { label: "优秀", cls: "good", color: "var(--good)" };
    if (s >= 60) return { label: "良好", cls: "fine", color: "var(--fine)" };
    if (s >= 40) return { label: "一般", cls: "ok", color: "var(--ok)" };
    return { label: "需关注", cls: "bad", color: "var(--bad)" };
  }

  /* ---------- dates ---------- */
  var WEEK = ["日", "一", "二", "三", "四", "五", "六"];
  function pad2(n) { return (n < 10 ? "0" : "") + n; }
  function dayKey(d) { return d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate()); }
  function addDays(d, n) { var x = new Date(d); x.setDate(x.getDate() + n); return x; }
  function startOfDay(d) { var x = new Date(d); x.setHours(0, 0, 0, 0); return x; }
  function fmtTime(ts) { var d = new Date(ts); return pad2(d.getHours()) + ":" + pad2(d.getMinutes()); }
  function relDay(ts) {
    var diff = Math.round((startOfDay(new Date()) - startOfDay(new Date(ts))) / 864e5);
    if (diff === 0) return "今天";
    if (diff === 1) return "昨天";
    var d = new Date(ts);

  }

  /* ---------- storage ---------- */
  var KEY = "shunchang.records.v1", SKEY = "shunchang.settings.v1", PKEY = "shunchang.profile.v1";
  function load(k) { try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : null; } catch (e) { return null; } }
  function save(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* storage unavailable: keep in memory */ } }

  function seedExamples() {
    var out = [], seed = 7;
    function rnd() { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; }
    var today = startOfDay(new Date());
    for (var i = 30; i >= 1; i--) {
      if (i === 12) { // one example day with diarrhoea: several trips in a day
        [[7, 40, 6, "yellow", "normal"], [10, 15, 7, "yellow", "easy"], [13, 5, 7, "yellow", "easy"], [17, 30, 6, "brown", "normal"]].forEach(function (t, k) {
          var dd = addDays(today, -i); dd.setHours(t[0], t[1]);
          out.push({ id: "ex12-" + k, ts: dd.getTime(), type: t[2], color: t[3], water: 7, effort: t[4], example: true });
        });
        continue;
      }
      if (rnd() < 0.15) continue; // a few days without a record
      var d = addDays(today, -i);
      var late = i <= 4; // the last few days drift toward constipation, to show the warning

      var color = late ? "brown" : (rnd() < 0.85 ? "brown" : (rnd() < 0.5 ? "yellow" : "green"));
      var water = late ? 3 + Math.floor(rnd() * 2) : 5 + Math.floor(rnd() * 4);
      var effort = late ? (rnd() < 0.6 ? "hard" : "vhard") : (type === 4 || type === 3 ? (rnd() < 0.6 ? "easy" : "normal") : "normal");
      d.setHours(7 + Math.floor(rnd() * 3), Math.floor(rnd() * 60));
      out.push({ id: "ex" + i, ts: d.getTime(), type: type, color: color, water: water, effort: effort, example: true });
    }
    return out;
  }

  var stored = load(KEY);
  var state = {
    records: stored || seedExamples(),
    settings: load(SKEY) || { daily: true, dailyTime: "08:30", water: true },
    profile: load(PKEY) || { loggedIn: false, phone: "", via: "", name: "", gender: "", birthYear: "", waterGoal: 8 },
    login: { phone: "", code: "", agree: false, countdown: 0 },
    confirmClear: false,
    range: "week",
    view: "home",
    draft: null,
    lastId: null,
    calMonth: startOfDay(new Date()),
    selDay: null

  state.calMonth.setDate(1);
  function persist() { save(KEY, state.records); }

  /* ---------- derived ---------- */
  function sorted() { return state.records.slice().sort(function (a, b) { return a.ts - b.ts; }); }
  function byDay() {
    var m = {};
    state.records.forEach(function (r) { var k = dayKey(new Date(r.ts)); (m[k] = m[k] || []).push(r); });
    return m;
  }
  function looseCount(list) { return list.filter(function (r) { return r.type >= 6; }).length; }
  function dayScore(list) {
    var avg = list.reduce(function (s, r) { return s + scoreOf(r); }, 0) / list.length;
    return Math.max(0, Math.round(avg - Math.max(0, looseCount(list) - 2) * 6));
  }
  function todayList() { return byDay()[dayKey(new Date())] || []; }
  function isAbnormal(r) { return r.color === "red" || r.color === "black" || r.color === "pale" || r.type === 1 || r.type === 7; }

  function evaluateAlerts(focus) {
    var alerts = [], all = sorted(), days = byDay(), today = startOfDay(new Date());
    var latest = focus || all[all.length - 1];
    if (latest && (latest.color === "red" || latest.color === "black")) {
      alerts.push({ level: "urgent", title: "建议尽快就医", text: "这次大便颜色为" + COLORS[latest.color].name + "，" + COLORS[latest.color].note + "。如果近期没有吃过相关食物或药物，请尽快到消化内科就诊；若伴随头晕、乏力、腹痛，请立即就医。", doctor: true });
    }
    var recentPale = all.filter(function (r) { return r.color === "pale" && r.ts > addDays(today, -3).getTime(); });
    if (recentPale.length) {
      alerts.push({ level: "urgent", title: "建议就医检查", text: "近 3 天出现灰白色大便，可能与肝胆问题有关。如同时有皮肤或眼白发黄、尿色变深，请尽快就医。", doctor: true });
    }
    var tl = days[dayKey(today)] || [], loose = looseCount(tl);
    if (loose >= 6) {
      alerts.push({ level: "urgent", title: "今天已腹泻 " + loose + " 次，建议就医", text: "一天内多次稀便容易脱水。请尽快就医，尤其是出现发热、便血、口干、尿少或头晕时。", doctor: true });
    } else if (loose >= 3) {
      alerts.push({ level: "warn", title: "今天已腹泻 " + loose + " 次", text: "一天 3 次及以上稀便属于腹泻。请少量多次补水，最好喝口服补液盐，饮食清淡。若次数继续增加、超过 2 天，或出现发热、便血、口干尿少，请就医。", doctor: false });
    }
    var watery = 0;
    for (var i = 0; i < 3; i++) {
      var l = days[dayKey(addDays(today, -i))];
      if (l && l.some(function (r) { return r.type >= 6; })) watery++;
    }
    if (watery >= 3) {
      alerts.push({ level: "urgent", title: "腹泻已持续 3 天", text: "连续多天出现糊状或水样便，注意补充水分和电解质。若伴随发热、便血或明显脱水，请及时就医。", doctor: true });
    }
    var hardDays = 0;
    for (var j = 0; j < 7; j++) {
      var l2 = days[dayKey(addDays(today, -j))];
      if (l2 && l2.some(function (r) { return r.type <= 2; })) hardDays++;
    }
    if (hardDays >= 3) {
      alerts.push({ level: "warn", title: "近期有便秘倾向", text: "过去 7 天里有 " + hardDays + " 天大便偏硬。建议每天喝够 8 杯水、多吃蔬菜和全谷物。如果持续超过 2 周、或出现便血和体重下降，请就医。", doctor: false });
    }
    var low = 0;
    for (var k = 0; k < 3; k++) {
      var l3 = days[dayKey(addDays(today, -k))];
      if (l3 && dayScore(l3) < 40) low++;
    }
    if (low >= 3) {
      alerts.push({ level: "warn", title: "连续 3 天评分偏低", text: "肠道状态持续不佳，建议调整饮食和作息；如果没有改善，请咨询医生。", doctor: true });
    }
    return alerts;
  }

  /* ---------- svg helpers ---------- */
  function bristolSvg(n) {
    var c = 'fill="currentColor"', s;
    switch (n) {
      case 1: s = '<circle cx="7" cy="15" r="4.5" ' + c + '/><circle cx="19" cy="11" r="4" ' + c + '/><circle cx="30" cy="16" r="4.5" ' + c + '/><circle cx="40" cy="11" r="3.5" ' + c + '/>'; break;
      case 2: s = '<g ' + c + '><circle cx="8" cy="14" r="6"/><circle cx="16" cy="12" r="6.5"/><circle cx="25" cy="14" r="6.5"/><circle cx="33" cy="12" r="6"/><circle cx="39" cy="14" r="5"/></g>'; break;
      case 3: s = '<rect x="2" y="7" width="40" height="13" rx="6.5" ' + c + '/><path d="M12 7v5M20 20v-5M27 7v4M34 20v-4" stroke="var(--surface)" stroke-width="1.6" stroke-linecap="round"/>'; break;

      case 6: s = '<path d="M3 17c1-5 5-4 6-7 2-4 6-1 8-4 3-3 6 1 8 0 3-2 6 0 7 3 2 0 5 1 6 4 1 4-4 6-9 6H8c-4 0-5-1-5-2z" ' + c + '/>'; break;
      default: s = '<ellipse cx="22" cy="17" rx="19" ry="6" ' + c + ' opacity=".55"/><circle cx="12" cy="8" r="2" ' + c + ' opacity=".55"/><circle cx="31" cy="7" r="1.6" ' + c + ' opacity=".55"/>';
    }
    return '<svg viewBox="0 0 44 26" aria-hidden="true">' + s + '</svg>';
  }
  function faceSvg(kind, on) {
    var mouth = { smile: "M9 18c2 2.5 8 2.5 10 0", flat: "M9.5 18.5h9", strain: "M9 19c2-2 8-2 10 0", pain: "M9 20c2-3.5 8-3.5 10 0" }[kind];
    var eyes = kind === "pain" || kind === "strain"
      ? '<path d="M8 11.5l3 1.2M20 11.5l-3 1.2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>'
      : '<circle cx="10" cy="12" r="1.5" fill="currentColor"/><circle cx="18" cy="12" r="1.5" fill="currentColor"/>';
    var drop = kind === "vhard" || kind === "pain" ? '<path d="M24 4c1.5 2 1.5 3.5 0 4-1.5-.5-1.5-2 0-4z" fill="currentColor" opacity=".6"/>' : "";
    return '<svg class="face" viewBox="0 0 28 28" aria-hidden="true"><circle cx="14" cy="14" r="12" fill="none" stroke="currentColor" stroke-width="1.6"/>' + eyes + '<path d="' + mouth + '" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round"/>' + drop + '</svg>';
  }
  var GLASS = '<svg viewBox="0 0 24 30" aria-hidden="true"><path d="M3 3h18l-2.2 23.2A2 2 0 0 1 16.8 28H7.2a2 2 0 0 1-2-1.8z" fill="currentColor" opacity=".9"/><path d="M5.3 9h13.4" stroke="var(--surface)" stroke-width="1.2" opacity=".6"/></svg>';
  var BACK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>';
  var BELL = '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v1M5 17h14l-1.5-2V11a5.5 5.5 0 0 0-11 0v4z"/><path d="M10 20a2 2 0 0 0 4 0"/></svg>';
  var HOSP = '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="3.5" width="17" height="17" rx="4"/><path d="M12 8v8M8 12h8"/></svg>';
  var LOGO = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M5 7c4-3 10-3 14 0M5 12c4-3 10-3 14 0M5 17c4-3 10-3 14 0"/></svg>';

  function ring(score, cls) {

    return '<div class="ring ' + (cls || "") + '" role="img" aria-label="评分 ' + score + ' 分，' + b.label + '"><svg viewBox="0 0 120 120"><circle class="track" cx="60" cy="60" r="' + r + '" stroke-width="11"/>' +
      '<circle class="val" cx="60" cy="60" r="' + r + '" stroke-width="11" stroke="' + b.color + '" stroke-dasharray="' + C.toFixed(1) + '" stroke-dashoffset="' + C.toFixed(1) + '" data-target="' + (C * (1 - score / 100)).toFixed(1) + '"/></svg>' +
      '<div class="center"><span class="big" style="color:' + b.color + '">' + score + '</span><span class="of" style="color:' + b.color + '">' + b.label + '</span></div></div>';
  }
  function animateRings() {
    requestAnimationFrame(function () {
      requestAnimationFrame(function () {

  }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function recordRow(r) {
    var s = scoreOf(r), b = band(s);
    return '<div class="row"><span class="thumb type" style="background:color-mix(in srgb, ' + b.color + ' 16%, var(--surface));color:' + b.color + '">' + b.label + '</span>' +
      '<div class="row-main"><div class="row-title">' + relDay(r.ts) + ' ' + fmtTime(r.ts) + ' · 第 ' + r.type + ' 型</div>' +
      '<div class="row-sub">' + COLORS[r.color].name + ' · ' + EFFORT[r.effort].name + ' · 喝水 ' + r.water + ' 杯</div></div>' +
      '<span class="score-badge" style="color:' + b.color + '">' + s + '</span></div>';
  }

  function adviceFor(r) {
    var tips = [];
    if (r.type <= 2) tips.push("大便偏硬：今天多喝 2～3 杯温水，多吃燕麦、红薯、绿叶菜等富含膳食纤维的食物。");
    if (r.type >= 6) tips.push("大便偏稀：注意补充水分和电解质，暂时少吃辛辣、油腻和生冷食物。");
    if (r.type === 3 || r.type === 4) tips.push("形状很理想，保持现在的饮食和作息。");
    if (r.water < goal()) tips.push("今天喝水还没达标（" + r.water * CUP_ML + " ml），建议再补充 " + (goal() - r.water) * CUP_ML + " ml 左右。");
    if (r.effort === "hard" || r.effort === "vhard") tips.push("排便费力时不要久蹲或用力屏气，可以试试脚下垫小凳，保持膝盖高于臀部。");
    if (r.color === "yellow" || r.color === "green") tips.push("颜色" + COLORS[r.color].note + "，通常一两天内会恢复，持续异常请留意。");
    tips.push("饭后散步 20 分钟、固定时间如厕，有助于养成规律排便。");
    return tips;
  }

  function viewResult() {
    var r = state.records.filter(function (x) { return x.id === state.lastId; })[0];
    if (!r) { state.view = "home"; return viewHome(); }
    var s = scoreOf(r), b = band(s), alerts = evaluateAlerts(r);
    var html = '<div class="pad"><div class="topbar"><button class="icon-btn" data-nav="home" aria-label="返回首页">' + BACK + '</button><h1>本次评分</h1></div>';
    html += '<section class="card result-hero">' + ring(s, "xl") +
      '<p class="muted small">' + relDay(r.ts) + ' ' + fmtTime(r.ts) + (todayList().length > 1 ? ' · 今天第 ' + todayList().length + ' 次' : '') + ' · 第 ' + r.type + ' 型 · ' + TYPES[r.type].tag + '</p></section>';
    html += '<div class="group"><div class="sec-title"><h2>各项表现</h2></div><section class="card">' + contribs(r, true).replace('class="contribs full"', 'class="contribs full" style="border-top:0;padding-top:0"') + '</section></div>';
    html += '<div class="group"><div class="sec-title"><h2>给你的建议</h2></div><section class="card"><ul class="tips">';
    adviceFor(r).forEach(function (t) { html += '<li>' + esc(t) + '</li>'; });
    html += '</ul></section></div>';
    if (alerts.length) {
      html += '<div class="group"><div class="sec-title"><h2>提示</h2></div>';
      alerts.forEach(function (a) { html += alertHtml(a); });
      html += '</div>';
    }
    html += '<div class="row-btns"><button class="btn ghost" data-nav="calendar">查看日历</button><button class="btn primary" data-nav="home">完成</button></div>';
    html += '<p class="disclaimer">评分仅用于日常健康记录，不能替代医生的诊断。</p></div>';
    return html;
  }

  function viewCalendar() {
    var m = state.calMonth, y = m.getFullYear(), mo = m.getMonth();
    var days = byDay(), today = startOfDay(new Date());
    var first = new Date(y, mo, 1), lead = (first.getDay() + 6) % 7, total = new Date(y, mo + 1, 0).getDate();
    var scores = [], abnormalDays = 0;
    for (var d = 1; d <= total; d++) {
      var l = days[dayKey(new Date(y, mo, d))];
      if (l) { scores.push(dayScore(l)); if (l.some(isAbnormal)) abnormalDays++; }
    }
    var avg = scores.length ? Math.round(scores.reduce(function (a, b) { return a + b; }, 0) / scores.length) : null;
    var isCurrent = y === today.getFullYear() && mo === today.getMonth();

    var html = '<div class="pad"><div class="cal-head"><button class="icon-btn" data-action="prev-month" aria-label="上个月">' + BACK + '</button>' +
      '<h1 class="num">' + y + ' 年 ' + (mo + 1) + ' 月</h1>' +
      '<button class="icon-btn" data-action="next-month" aria-label="下个月"' + (isCurrent ? " disabled style=\"opacity:.35\"" : "") + ' ><span style="transform:scaleX(-1);display:grid">' + BACK + '</span></button></div>';
    html += '<div class="stats"><div class="stat"><span class="num">' + scores.length + '</span><span>记录天数</span></div>' +
      '<div class="stat"><span class="num" style="color:' + (avg != null ? band(avg).color : "inherit") + '">' + (avg != null ? avg : "–") + '</span><span>平均分</span></div>' +
      '<div class="stat"><span class="num" style="color:' + (abnormalDays ? "var(--bad)" : "inherit") + '">' + abnormalDays + '</span><span>异常天数</span></div></div>';
    var lastDay = isCurrent ? today.getDate() : total;
    if (!(new Date(y, mo, 1) > today)) {
      html += '<section class="card"><div class="cap"><span class="cap-label">' + LOGO + '评分走势</span><span class="muted">虚线为月平均</span></div>' +
        lineChart(series(new Date(y, mo, 1), new Date(y, mo, lastDay), function (d) { return d.getDate() + "日"; }), monthTicks) + '</section>';
    }

    html += '<section class="card"><div class="cal">';
    ["一", "二", "三", "四", "五", "六", "日"].forEach(function (w) { html += '<span class="dow">' + w + '</span>'; });
    for (var e = 0; e < lead; e++) html += '<span class="day empty"></span>';
    for (var dd = 1; dd <= total; dd++) {
      var date = new Date(y, mo, dd), k = dayKey(date), list = days[k], future = date > today;
      var cls = "day" + (list ? " has" : "") + (future ? " future" : "") + (date.getTime() === today.getTime() ? " today" : "") + (state.selDay === k ? " sel" : "");
      var style = "", inner = '<span class="d">' + dd + '</span>';
      if (list) {
        var sc = dayScore(list), b = band(sc);
        style = ' style="background:color-mix(in srgb, ' + b.color + ' 22%, var(--surface));color:' + b.color + '"';
        inner += '<span class="s">' + sc + '</span>' + (list.length > 1 ? '<span class="cnt">' + list.length + '次</span>' : '') + (list.some(isAbnormal) ? '<span class="flag" title="有异常"></span>' : '');
      }
      html += '<button class="' + cls + '"' + style + ' data-day="' + k + '"' + (future ? " disabled" : "") + ' aria-label="' + (mo + 1) + '月' + dd + '日' + (list ? "，" + dayScore(list) + " 分" : "，无记录") + '">' + inner + '</button>';
    }
    html += '</div><div class="legend"><span><i style="background:var(--perfect)"></i>95+ 完美</span><span><i style="background:var(--good)"></i>80–94 优秀</span><span><i style="background:var(--fine)"></i>60–79 良好</span><span><i style="background:var(--ok)"></i>40–59 一般</span><span><i style="background:var(--bad)"></i>&lt;40 需关注</span><span><i style="background:var(--bad);border-radius:50%"></i>有异常</span></div></section>';

    var sel = state.selDay || (isCurrent && days[dayKey(today)] ? dayKey(today) : null);
    if (!sel) {
      // default to the most recent recorded day in this month
      for (var z = total; z >= 1; z--) { var kk = dayKey(new Date(y, mo, z)); if (days[kk]) { sel = kk; break; } }
    }
    if (sel && days[sel]) {
      var parts = sel.split("-"), list2 = days[sel].slice().sort(function (a, b) { return a.ts - b.ts; });
      html += '<section class="card"><div class="card-head"><h2>' + Number(parts[1]) + '月' + Number(parts[2]) + '日的记录</h2><span class="pill ' + band(dayScore(list2)).cls + '">' + dayScore(list2) + ' 分 · ' + band(dayScore(list2)).label + '</span></div><div class="rows">';
      list2.forEach(function (r) { html += recordRow(r); });
      html += '</div></section>';
    } else if (sel) {
      html += '<section class="card"><p class="muted small">这一天没有记录。</p></section>';
    } else {
      html += '<section class="card"><p class="muted small">这个月还没有记录。点下方相机按钮开始记录。</p></section>';
    }
    html += '</div>';
    return html;
  }

  /* ---------- render ---------- */
  var screen = document.getElementById("screen"), phone = document.getElementById("phone");
  function render(keepScroll) {
    var top = screen.scrollTop;
    var v = state.view;
    screen.innerHTML = v === "record" ? viewRecord() : v === "result" ? viewResult() : v === "calendar" ? viewCalendar() : v === "settings" ? viewSettings() : viewHome();
    phone.classList.toggle("no-tabs", v === "record" || v === "result" || v === "settings");
    document.querySelectorAll(".tab").forEach(function (t) { t.setAttribute("aria-current", t.getAttribute("data-nav") === v ? "page" : "false"); });
    screen.scrollTop = keepScroll ? top : 0;
    animateRings();
    var input = document.getElementById("photo-input");
    if (input) input.addEventListener("change", onPhoto);
  }
  function go(view) {
    if (view === "record" && (state.view !== "record" || !state.draft)) state.draft = newDraft();
    if (view === "calendar" && state.view !== "calendar") { state.selDay = null; }
    if (view === "settings") state.confirmClear = false;
    state.view = view;
    render(false);
  }
  function toast(msg) {
    phone.querySelectorAll(".toast").forEach(function (old) { old.remove(); });
    var t = document.createElement("div");
    t.className = "toast"; t.textContent = msg; t.setAttribute("role", "status");
    phone.appendChild(t);
    setTimeout(function () { t.remove(); }, 1800);
  }

  /* ---------- photo analysis (demo: estimates colour from pixels) ---------- */
  function analyzeImage(img) {
    var c = document.createElement("canvas"), W = 120, H = Math.max(1, Math.round(120 * img.height / img.width));
    c.width = W; c.height = H;
    var ctx = c.getContext("2d");
    ctx.drawImage(img, 0, 0, W, H);
    var data = ctx.getImageData(Math.floor(W * .2), Math.floor(H * .2), Math.ceil(W * .6), Math.ceil(H * .6)).data;
    var r = 0, g = 0, b = 0, n = 0;
    for (var i = 0; i < data.length; i += 4) {
      var R = data[i], G = data[i + 1], B = data[i + 2];
      var mx = Math.max(R, G, B), mn = Math.min(R, G, B), l = (mx + mn) / 510, s = mx === mn ? 0 : (mx - mn) / (255 - Math.abs(mx + mn - 255));
      if (l > .82 && s < .25) continue;           // porcelain / white background
      if (B > R + 10 && B > G) continue;           // water / blue tint
      r += R; g += G; b += B; n++;
    }
    var color = "brown";
    if (n > 20) {
      r /= n; g /= n; b /= n;
      var mx2 = Math.max(r, g, b), mn2 = Math.min(r, g, b), L = (mx2 + mn2) / 510, S = mx2 === mn2 ? 0 : (mx2 - mn2) / (255 - Math.abs(mx2 + mn2 - 255)), hue = 0;
      if (mx2 !== mn2) {
        if (mx2 === r) hue = 60 * (((g - b) / (mx2 - mn2)) % 6);
        else if (mx2 === g) hue = 60 * ((b - r) / (mx2 - mn2) + 2);
        else hue = 60 * ((r - g) / (mx2 - mn2) + 4);
      }
      if (hue < 0) hue += 360;
      if (L < .16) color = "black";
      else if (L > .68 && S < .3) color = "pale";
      else if (S > .45 && (hue >= 345 || hue < 12) && r > 110) color = "red";
      else if (hue >= 65 && hue < 170) color = "green";
      else if (hue >= 40 && hue < 65 && L > .42) color = "yellow";
    }
    var thumb = document.createElement("canvas");
    thumb.width = 96; thumb.height = 96;
    var side = Math.min(img.width, img.height);
    thumb.getContext("2d").drawImage(img, (img.width - side) / 2, (img.height - side) / 2, side, side, 0, 0, 96, 96);
    var big = document.createElement("canvas"), scale = Math.min(1, 800 / Math.max(img.width, img.height));
    big.width = Math.round(img.width * scale); big.height = Math.round(img.height * scale);
    big.getContext("2d").drawImage(img, 0, 0, big.width, big.height);
    return { color: color, thumb: thumb.toDataURL("image/jpeg", .7), photo: big.toDataURL("image/jpeg", .82) };
  }
  function useImage(img) {
    var res = analyzeImage(img), d = state.draft;
    d.photo = res.photo; d.thumb = res.thumb; d.autoColor = res.color; d.color = res.color;
    render(true);
  }
  function onPhoto(e) {
    var f = e.target.files && e.target.files[0];
    if (!f) return;
    var reader = new FileReader();
    reader.onload = function () {
      var img = new Image();
      img.onload = function () { useImage(img); };
      img.onerror = function () { toast("这张图片打不开，请换一张"); };
      img.src = reader.result;
    };
    reader.readAsDataURL(f);
  }
  function samplePhoto() {
    var c = document.createElement("canvas"); c.width = 600; c.height = 450;
    var x = c.getContext("2d");
    var g = x.createRadialGradient(300, 230, 40, 300, 230, 360);
    g.addColorStop(0, "#f2f4f3"); g.addColorStop(1, "#cfd8d6");
    x.fillStyle = g; x.fillRect(0, 0, 600, 450);
    x.fillStyle = "rgba(170,200,205,.55)"; x.beginPath(); x.ellipse(300, 250, 230, 150, 0, 0, Math.PI * 2); x.fill();
    x.strokeStyle = "#6e4325"; x.lineWidth = 46; x.lineCap = "round";
    x.beginPath(); x.moveTo(170, 280); x.bezierCurveTo(230, 180, 330, 300, 430, 210); x.stroke();
    x.strokeStyle = "rgba(255,255,255,.12)"; x.lineWidth = 8;
    x.beginPath(); x.moveTo(180, 268); x.bezierCurveTo(235, 175, 330, 285, 420, 200); x.stroke();
    var img = new Image();
    img.onload = function () { useImage(img); state.draft.type = state.draft.type || 4; render(true); };
    img.src = c.toDataURL("image/jpeg", .9);
  }

  function submit() {
    var d = state.draft;
    if (!d || (!d.photo && d.nth <= 1) || !d.color || !d.type || !d.effort) return;
    var ov = document.createElement("div");
    ov.className = "overlay";
    ov.innerHTML = '<div class="scan">' + LOGO + '</div><b>正在分析…</b><span class="muted small">识别颜色 · 判断形状 · 计算评分</span>';
    phone.appendChild(ov);
    setTimeout(function () {
      var hadExamples = state.records.some(function (r) { return r.example; });
      var rec = { id: "r" + Date.now(), ts: Date.now(), type: d.type, color: d.color, water: d.water, effort: d.effort };
      state.records.push(rec);
      persist();
      state.lastId = rec.id; state.draft = null;
      ov.remove();
      state.view = "result";
      render(false);
      toast(hadExamples ? "已保存（示例数据仍在，可在首页清除）" : "已保存到日历");
    }, 1100);
  }

  /* ---------- events ---------- */
  document.addEventListener("click", function (e) {
    var el = e.target.closest("[data-nav],[data-action],[data-color],[data-type],[data-water],[data-effort],[data-day],[data-gender]");
    if (!el || el.disabled) return;
    var d = state.draft;
    if (el.hasAttribute("data-nav")) return go(el.getAttribute("data-nav"));
    if (el.hasAttribute("data-color")) { d.color = el.getAttribute("data-color"); return render(true); }
    if (el.hasAttribute("data-type")) { d.type = Number(el.getAttribute("data-type")); return render(true); }
    if (el.hasAttribute("data-water")) { var w = Number(el.getAttribute("data-water")); d.water = d.water === w ? w - 1 : w; return render(true); }
    if (el.hasAttribute("data-effort")) { d.effort = el.getAttribute("data-effort"); return render(true); }
    if (el.hasAttribute("data-day")) { state.selDay = el.getAttribute("data-day"); return render(true); }
    if (el.hasAttribute("data-gender")) { state.profile.gender = el.getAttribute("data-gender"); saveProfile(); return render(true); }
    switch (el.getAttribute("data-action")) {
      case "sample": samplePhoto(); break;
      case "submit": submit(); break;
      case "clear-examples":
        state.records = state.records.filter(function (r) { return !r.example; });
        persist(); render(true); toast("示例数据已清除"); break;
      case "range-week": state.range = "week"; render(true); break;
      case "range-month": state.range = "month"; render(true); break;
      case "send-code": sendCode(); break;
      case "login": loginPhone(); break;
      case "login-wechat": loginVia("微信"); break;
      case "login-apple": loginVia("Apple"); break;
      case "logout": state.profile.loggedIn = false; state.profile.phone = ""; state.profile.via = ""; saveProfile(); render(true); toast("已退出登录"); break;
      case "goal-minus": state.profile.waterGoal = Math.max(4, goal() - 1); saveProfile(); render(true); break;
      case "goal-plus": state.profile.waterGoal = Math.min(16, goal() + 1); saveProfile(); render(true); break;
      case "clear-ask": state.confirmClear = true; render(true); break;
      case "clear-cancel": state.confirmClear = false; render(true); break;
      case "clear-all": state.records = []; persist(); state.confirmClear = false; render(true); toast("全部记录已删除"); break;
      case "prev-month": state.calMonth = new Date(state.calMonth.getFullYear(), state.calMonth.getMonth() - 1, 1); state.selDay = null; render(true); break;
      case "next-month": state.calMonth = new Date(state.calMonth.getFullYear(), state.calMonth.getMonth() + 1, 1); state.selDay = null; render(true); break;
    }
  });
  document.addEventListener("change", function (e) {
    var id = e.target.id, st = state.settings;
    if (id === "daily-on") { st.daily = e.target.checked; toast(st.daily ? "每天 " + st.dailyTime + " 提醒你记录" : "已关闭每日提醒"); }
    else if (id === "water-on") { st.water = e.target.checked; toast(st.water ? "已开启喝水提醒" : "已关闭喝水提醒"); }
    else if (id === "daily-time") { st.dailyTime = e.target.value || "08:30"; toast("提醒时间改为 " + st.dailyTime); }
    else if (id === "pf-name") { state.profile.name = e.target.value.trim(); saveProfile(); toast("昵称已保存"); return; }
    else if (id === "pf-year") { state.profile.birthYear = e.target.value; saveProfile(); return; }
    else if (id === "login-agree") { state.login.agree = e.target.checked; return; }
    else return;
    save(SKEY, st);
  });
  document.addEventListener("input", function (e) {
    if (e.target.id === "login-phone") state.login.phone = e.target.value.replace(/\D/g, "");
    if (e.target.id === "login-code") state.login.code = e.target.value.replace(/\D/g, "");
  });

  /* ---------- login (demo: no real SMS is sent) ---------- */
  function saveProfile() { save(PKEY, state.profile); }
  function loginError(msg) {
    var el = document.getElementById("login-err");
    if (el) { el.textContent = msg; el.hidden = !msg; }
  }
  function sendCode() {
    var L = state.login;
    if (!/^1\d{10}$/.test(L.phone)) return loginError("请输入 11 位手机号");
    loginError("");
    L.countdown = 60;
    toast("验证码已发送（演示）");
    var t = setInterval(function () {
      L.countdown--;
      var b = document.getElementById("send-code");
      if (b) { b.disabled = L.countdown > 0; b.textContent = L.countdown > 0 ? L.countdown + " 秒后重发" : "获取验证码"; }
      if (L.countdown <= 0) clearInterval(t);
    }, 1000);
    var b0 = document.getElementById("send-code");
    if (b0) { b0.disabled = true; b0.textContent = "60 秒后重发"; }
  }
  function finishLogin(via, phoneNum) {
    var p = state.profile;
    p.loggedIn = true; p.via = via; p.phone = phoneNum || "";
    if (!p.name) p.name = via === "手机" ? "用户" + phoneNum.slice(-4) : via + "用户";
    saveProfile();
    state.login = { phone: "", code: "", agree: false, countdown: 0 };
    render(false);
    toast("登录成功");
  }
  function loginPhone() {
    var L = state.login;
    if (!/^1\d{10}$/.test(L.phone)) return loginError("请输入 11 位手机号");
    if (!/^\d{6}$/.test(L.code)) return loginError("请输入 6 位验证码");
    if (!L.agree) return loginError("请先勾选同意用户协议和隐私政策");
    finishLogin("手机", L.phone);
  }
  function loginVia(via) {
    if (!state.login.agree) return loginError("请先勾选同意用户协议和隐私政策");
    finishLogin(via, "");
  }

  render(false);
})();
</script>
</body>
</html>
