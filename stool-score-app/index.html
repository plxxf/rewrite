<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>顺畅肠道日记</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap">
<style>
/* Layout: a single phone-shaped app shell (full-bleed on phones, framed on desktop) with a scrolling screen and a bottom tab bar. */
:root {
  --bg: #E9E9EC;
  --frame: #F5F5F7;
  --surface: #FFFFFF;
  --fill: #F0F0F2;
  --seg-on: #FFFFFF;
  --ink: #141416;
  --muted: #85858C;
  --line: #E8E8EC;
  --btn: #141416;
  --btn-ink: #FFFFFF;
  --accent: #EBA437;
  --accent-2: #F6C875;
  --accent-strong: #94590A;
  --accent-ink: #2A1A00;
  --accent-soft: #FBF1E0;
  --perfect: #5E5CE6; --perfect-2: #A3A1F7;
  --good: #3F7CF6; --good-2: #8FB4FF;
  --fine: #3AA8DC; --fine-2: #93D6F3;
  --ok: #EE963A; --ok-2: #F8C788;
  --bad: #E5484D; --bad-2: #F49A9D;
  --bad-soft: #FDEEEE;
  --warn-soft: #FDF4E8;
  --card-shadow: 0 1px 2px rgba(20, 20, 22, .04), 0 4px 14px rgba(20, 20, 22, .04);
  --stool: #7A4A26;
  --shadow: 0 20px 60px rgba(0, 0, 0, .14);
  --f-display: -apple-system, "SF Pro Display", "SF Pro Rounded", system-ui, "PingFang SC", "Noto Sans SC", sans-serif;
  --f-body: -apple-system, "SF Pro Text", system-ui, "PingFang SC", "Noto Sans SC", "Microsoft YaHei", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0A0A0B; --frame: #000000; --surface: #18181B; --fill: #26262A; --seg-on: #55555C; --ink: #F5F5F7; --muted: #8C8C94;
    --line: #2A2A2F; --btn: #F5F5F7; --btn-ink: #111113; --accent: #F2B04E; --accent-2: #F8D08E; --accent-strong: #F6C474; --accent-ink: #2A1A00; --accent-soft: #2E2210;
    --perfect: #7D7AFF; --perfect-2: #B7B5FF; --good: #4D8DFF; --good-2: #9DC0FF; --fine: #5AC8FA; --fine-2: #A9E4FC; --ok: #FFA552; --ok-2: #FFD3A0; --bad: #FF5F5F; --bad-2: #FFA3A3;
    --bad-soft: #351A1A; --warn-soft: #33250F; --card-shadow: none;
    --stool: #B27B4F; --shadow: 0 20px 60px rgba(0, 0, 0, .6); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0A0A0B; --frame: #000000; --surface: #18181B; --fill: #26262A; --seg-on: #55555C; --ink: #F5F5F7; --muted: #8C8C94;
    --line: #2A2A2F; --btn: #F5F5F7; --btn-ink: #111113; --accent: #F2B04E; --accent-2: #F8D08E; --accent-strong: #F6C474; --accent-ink: #2A1A00; --accent-soft: #2E2210;
    --perfect: #7D7AFF; --perfect-2: #B7B5FF; --good: #4D8DFF; --good-2: #9DC0FF; --fine: #5AC8FA; --fine-2: #A9E4FC; --ok: #FFA552; --ok-2: #FFD3A0; --bad: #FF5F5F; --bad-2: #FFA3A3;
    --bad-soft: #351A1A; --warn-soft: #33250F; --card-shadow: none;
  --stool: #B27B4F; --shadow: 0 20px 60px rgba(0, 0, 0, .6); color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.55;
  display: flex; justify-content: center; align-items: center; overflow: hidden;
}
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.phone {
  position: relative; display: flex; flex-direction: column; width: 100%; height: 100%;
  background: var(--frame); overflow: hidden;
}
@media (min-width: 560px) {
  .phone { width: 400px; height: min(840px, calc(100% - 40px)); border-radius: 40px; border: 1px solid var(--line); box-shadow: var(--shadow); }
}
.screen { flex: 1; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; }
.pad {
  display: flex; flex-direction: column; gap: 14px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 18px 110px;
}

/* type */
h1, h2, h3, p { margin: 0; }
h1 { font-size: 24px; font-weight: 700; text-wrap: balance; letter-spacing: -.01em; }
h2 { font-size: 15px; font-weight: 700; }
.eyebrow { font-size: 12px; color: var(--muted); letter-spacing: .06em; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.num { font-family: var(--f-display); font-variant-numeric: tabular-nums; }

.hello { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; }
.brand { font-family: var(--f-display); font-weight: 800; font-size: 13px; letter-spacing: .08em; color: var(--accent-strong); display: inline-flex; align-items: center; gap: 6px; }
.brand svg { width: 22px; height: 22px; }

.card { background: var(--surface); box-shadow: var(--card-shadow); border-radius: 18px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.card-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.link { background: none; border: 0; padding: 0; color: var(--accent-strong); font-size: 13px; font-weight: 500; }

/* apple-health-like grouping */
.pad.home { gap: 26px; }
.group { display: flex; flex-direction: column; gap: 8px; }
.sec-title { display: flex; justify-content: space-between; align-items: baseline; padding: 0 4px; }
.sec-title h2 { font-size: 21px; font-weight: 700; letter-spacing: -.01em; }
.hello h1 { font-size: 28px; line-height: 1.25; letter-spacing: -.02em; }
.cap { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 13px; }
.cap-label { color: var(--accent-strong); font-weight: 600; display: inline-flex; gap: 6px; align-items: center; }
.cap-label svg { width: 16px; height: 16px; }
.cap .chev { color: var(--muted); display: inline-flex; align-items: center; gap: 2px; background: none; border: 0; padding: 0; font-size: 13px; }
.kpi { display: flex; align-items: baseline; gap: 3px; }
.kpi-num { font-family: var(--f-display); font-size: 34px; font-weight: 700; letter-spacing: -.02em; line-height: 1.1; font-variant-numeric: tabular-nums; }
.kpi-unit { font-size: 15px; color: var(--muted); font-weight: 600; }
.score-row { display: grid; grid-template-columns: auto 1fr; gap: 18px; align-items: center; }
.score-text { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.ring.xl { width: 184px; height: 184px; }
.ring.xl .big { font-size: 60px; }
.ring .of { font-size: 12px; font-weight: 600; }
.contribs { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 16px; padding-top: 4px; border-top: 1px solid var(--line); padding-block: 14px 2px; }
.contribs.full { grid-template-columns: 1fr; }
.contrib { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.c-top { display: flex; justify-content: space-between; align-items: baseline; gap: 6px; font-size: 14px; font-weight: 600; }
.c-lvl { font-size: 12px; font-weight: 500; color: var(--muted); }
.c-w { font-size: 11px; font-weight: 400; color: var(--muted); }
.c-bar { height: 6px; border-radius: 999px; background: var(--fill); overflow: hidden; }
.c-bar i { display: block; height: 100%; border-radius: inherit; }
.c-sub { display: flex; justify-content: space-between; gap: 6px; font-size: 12px; color: var(--muted); }
.c-sub span:first-child { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.segctl { display: grid; grid-template-columns: 1fr 1fr; background: var(--fill); border-radius: 9px; padding: 2px; }
.segctl button { border: 0; background: none; border-radius: 7px; padding: 5px 0; font-size: 13px; font-weight: 600; }
.segctl button[aria-selected="true"] { background: var(--seg-on); box-shadow: 0 1px 3px rgba(0,0,0,.14); }
.lchart { width: 100%; height: auto; display: block; overflow: visible; }
.lchart .grid { stroke: var(--line); stroke-width: 1; }
.lchart .ax { fill: var(--muted); font-size: 10px; font-family: var(--f-body); }
.lchart .line { fill: none; stroke: var(--good); stroke-width: 2.2; stroke-linejoin: round; stroke-linecap: round; }
.lchart .area { fill: var(--good); opacity: .1; }
.lchart .avg { stroke: var(--muted); stroke-dasharray: 3 3; stroke-width: 1; }
.lchart .dot { stroke: var(--surface); stroke-width: 1.5; }
.today-strip { display: flex; flex-direction: column; gap: 8px; border-top: 1px solid var(--line); padding-top: 12px; }
.ts-head { display: flex; justify-content: space-between; align-items: baseline; font-size: 14px; }
.ts-list { display: flex; flex-wrap: wrap; gap: 6px; }
.ts-item { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; background: var(--fill); border-radius: 8px; padding: 3px 8px; font-variant-numeric: tabular-nums; }
.ts-item i { width: 8px; height: 8px; border-radius: 50%; }
.day .cnt { font-size: 9px; font-weight: 600; line-height: 1; color: var(--muted); }
.wcnt { font-size: 10px; color: var(--muted); line-height: 1; }
.notice { display: flex; flex-direction: column; gap: 4px; background: var(--accent-soft); border-radius: 14px; padding: 12px 14px; font-size: 13px; }
.ok-note { display: flex; gap: 10px; align-items: center; font-size: 13px; }
.ok-note svg { width: 20px; height: 20px; color: var(--good); flex: none; }

/* v0.3 additions */
.streak { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 600; color: var(--accent-strong); background: var(--accent-soft); border-radius: 999px; padding: 2px 10px; margin-top: 6px; }
button.row { background: none; border: 0; border-top: 1px solid var(--line); width: 100%; text-align: left; font: inherit; color: inherit; cursor: pointer; }
button.row:first-child { border-top: 0; }
.photo img.blurred { filter: blur(22px) saturate(.5); transform: scale(1.15); }
.peek { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); background: rgba(0,0,0,.6); color: #fff; border: 0; border-radius: 12px; padding: 8px 14px; font-size: 13px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chips .chip { padding: 6px 12px; }
.sub-h { font-size: 12px; color: var(--muted); }
.time-row { display: flex; gap: 10px; align-items: center; justify-content: space-between; }
.time-row input { border: 1px solid var(--line); background: var(--fill); border-radius: 10px; padding: 6px 8px; font-size: 14px; max-width: 58%; min-width: 0; }
.tagline { font-size: 13px; display: flex; gap: 8px; }
.tagline b { flex: none; min-width: 64px; }
.badges { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.badge { background: var(--fill); border-radius: 14px; padding: 10px 6px; text-align: center; font-size: 12px; display: flex; flex-direction: column; align-items: center; gap: 4px; }
.badge .medal { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; background: var(--line); color: var(--muted); font-weight: 800; font-size: 14px; font-family: var(--f-display); }
.badge.on .medal { background: linear-gradient(145deg, var(--accent-2), var(--accent)); color: var(--accent-ink); }
.badge:not(.on) { color: var(--muted); }
.list-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; width: 100%; background: none; border: 0; padding: 12px 0; border-top: 1px solid var(--line); font-size: 14px; text-align: left; }
.list-row:first-of-type { border-top: 0; }
.list-row.danger-text { color: var(--bad); }
.list-row svg { color: var(--muted); flex: none; }
.dist { display: flex; flex-direction: column; gap: 8px; }
.dist-row { display: grid; grid-template-columns: 84px 1fr 34px; gap: 8px; align-items: center; font-size: 12px; }
.dist-bar { height: 8px; border-radius: 999px; background: var(--fill); overflow: hidden; }
.dist-bar i { display: block; height: 100%; border-radius: inherit; }
.dist-row .num { text-align: right; }
.delta { font-size: 13px; font-weight: 600; }
.copybox { width: 100%; min-height: 160px; border: 1px solid var(--line); border-radius: 12px; background: var(--fill); padding: 10px; font-size: 12px; font-family: var(--f-body); resize: vertical; }
.doc { font-size: 14px; line-height: 1.75; display: flex; flex-direction: column; gap: 10px; }
.doc h3 { font-size: 15px; margin-top: 4px; }
.onb { position: absolute; inset: 0; z-index: 40; background: var(--frame); display: flex; flex-direction: column; gap: 16px; padding: calc(20px + env(safe-area-inset-top, 0px)) max(24px, env(safe-area-inset-right, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)) max(24px, env(safe-area-inset-left, 0px)); }
.onb-skip { align-self: flex-end; background: none; border: 0; color: var(--muted); font-size: 14px; padding: 6px 0; }
.onb-art { flex: 1; display: grid; place-items: center; min-height: 0; }
.onb h1 { font-size: 28px; }
.onb p { color: var(--muted); font-size: 15px; }
.art-circle { width: 176px; height: 176px; border-radius: 50%; background: var(--accent-soft); display: grid; place-items: center; color: var(--accent-strong); }
.art-circle svg { width: 84px; height: 84px; }
.dots { display: flex; gap: 6px; justify-content: center; }
.dots i { width: 7px; height: 7px; border-radius: 4px; background: var(--line); }
.dots i.on { background: var(--accent); width: 20px; }
.onb .legend { justify-content: center; }
.onb { touch-action: pan-y; user-select: none; -webkit-user-select: none; }
.onb-slide { flex: 1; display: flex; flex-direction: column; gap: 16px; min-height: 0; will-change: transform; }
.onb-slide.dragging { transition: none; }
.onb-slide.settle { transition: transform .25s ease, opacity .25s ease; }
.onb-slide.in-next { animation: onbNext .3s ease both; }
.onb-slide.in-prev { animation: onbPrev .3s ease both; }
@keyframes onbNext { from { transform: translateX(48px); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes onbPrev { from { transform: translateX(-48px); opacity: 0; } to { transform: none; opacity: 1; } }
.wheels { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.wcolumn { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.wcolumn > span { font-size: 12px; color: var(--muted); text-align: center; }
.wheel-box { position: relative; height: 132px; }
.wheel-box::before { content: ""; position: absolute; left: 0; right: 0; top: 44px; height: 44px; border-radius: 12px; background: var(--fill); pointer-events: none; }
.wheel { position: relative; height: 132px; overflow-y: auto; scroll-snap-type: y mandatory; padding-block: 44px; scrollbar-width: none; overscroll-behavior: contain;
  -webkit-mask-image: linear-gradient(transparent, #000 30%, #000 70%, transparent); mask-image: linear-gradient(transparent, #000 30%, #000 70%, transparent); }
.wheel::-webkit-scrollbar { display: none; }
.wheel:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 12px; }
.wi { height: 44px; line-height: 44px; text-align: center; scroll-snap-align: center; font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums; font-family: var(--f-display); }
.wi small { font-size: 12px; color: var(--muted); font-weight: 500; margin-left: 2px; }
.basic-sum { background: var(--surface); border-radius: 14px; padding: 10px 12px; font-size: 13px; display: flex; flex-direction: column; gap: 2px; }
.card .basic-sum { background: var(--fill); }
.onb .wheel-box::before { background: var(--surface); }
.onb-form { flex: 1; display: flex; flex-direction: column; gap: 14px; min-height: 0; overflow-y: auto; }
.onb-form .mini-seg { justify-content: flex-start; }
.onb-hint { text-align: center; font-size: 12px !important; margin-top: -6px; }
@media (prefers-reduced-motion: reduce) { .onb-slide.in-next, .onb-slide.in-prev { animation: none; } }

/* avatar + settings */
.hello-left { display: flex; align-items: center; gap: 12px; min-width: 0; }
.avatar { width: 42px; height: 42px; border-radius: 15px; border: 0; background: var(--surface); color: var(--accent-strong); display: grid; place-items: center; font-weight: 700; font-size: 17px; flex: none; padding: 0; }
.avatar svg { width: 22px; height: 22px; }
.avatar.lg { width: 54px; height: 54px; border-radius: 18px; background: var(--accent-soft); font-size: 22px; }
.profile { flex-direction: row; align-items: center; gap: 14px; }
.grow { flex: 1; min-width: 0; }
.input { display: flex; align-items: center; gap: 8px; border: 1.5px solid var(--line); border-radius: 14px; padding: 0 12px; background: var(--fill); flex: 1; min-width: 0; }
.input:focus-within { border-color: var(--accent-strong); }
.input span { color: var(--muted); font-size: 14px; }
.input input { border: 0; background: none; padding: 12px 0; width: 100%; min-width: 0; outline: none; }
.code-row { display: flex; gap: 8px; }
.code-row .btn { flex: none; padding: 0 14px; font-size: 14px; font-weight: 500; }
.agree { display: flex; gap: 8px; align-items: flex-start; font-size: 12px; color: var(--muted); }
.agree input { margin: 3px 0 0; accent-color: var(--accent-strong); }
.err { color: var(--bad); }
.or { display: flex; align-items: center; gap: 10px; font-size: 12px; color: var(--muted); }
.or::before, .or::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.inline-input { border: 1px solid var(--line); background: var(--fill); border-radius: 10px; padding: 6px 10px; font-size: 14px; width: 150px; max-width: 55%; text-align: right; }
.mini-seg { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.chip { border: 1.5px solid var(--line); background: var(--surface); border-radius: 999px; padding: 3px 12px; font-size: 13px; }
.chip[aria-pressed="true"] { border-color: var(--ink); background: var(--ink); color: var(--surface); font-weight: 600; }
.stepper { display: flex; align-items: center; gap: 10px; flex: none; }
.stepper .num { font-size: 18px; font-weight: 800; min-width: 22px; text-align: center; }
.icon-btn.sm { width: 32px; height: 32px; border-radius: 10px; background: var(--fill); font-size: 18px; font-weight: 700; }
.btn.danger { background: var(--bad); color: var(--surface); }
.btn.danger-text { color: var(--bad); }
.confirm { display: flex; flex-direction: column; gap: 10px; }
.thumb.type { font-size: 12px; font-weight: 700; }
.mring { position: relative; display: grid; place-items: center; flex: none; }
.mring svg { position: absolute; inset: 0; width: 100%; height: 100%; transform: rotate(-90deg); }
.mring .mt { fill: none; stroke: var(--line); }
.mring b { position: relative; font-family: var(--f-display); font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1; }
.row .chev-r { color: var(--muted); width: 18px; height: 18px; }
.ic { width: 20px; height: 20px; flex: none; }
.alert-title .ic { width: 18px; height: 18px; }
.water-ctl { display: grid; grid-template-columns: 52px 1fr 52px; align-items: center; gap: 12px; }
.water-ctl .icon-btn { width: 52px; height: 52px; border-radius: 50%; background: var(--fill); }
.water-ctl .icon-btn .ic { width: 22px; height: 22px; }
.water-mid { text-align: center; display: flex; flex-direction: column; }
.water-mid .num { font-size: 40px; font-weight: 700; line-height: 1.1; letter-spacing: -.02em; }
.water-bar { display: flex; gap: 4px; }
.water-bar i { flex: 1; height: 6px; border-radius: 3px; background: var(--fill); }
.water-bar i.on { background: linear-gradient(90deg, var(--fine-2), var(--fine)); }
.seg .ic { width: 28px; height: 28px; color: var(--muted); }
.seg .opt[aria-pressed="true"] .ic { color: var(--accent-strong); }
.streak .ic { width: 13px; height: 13px; }
.badge .medal .ic { width: 18px; height: 18px; }

/* banners */
.banner { display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: 16px; font-size: 13px; }
.banner.example { background: var(--accent-soft); }
.banner .grow { flex: 1; min-width: 0; }
.alert { border-radius: 20px; padding: 14px 16px; display: flex; flex-direction: column; gap: 6px; }
.alert.urgent { background: var(--bad-soft); border: 1px solid color-mix(in srgb, var(--bad) 35%, transparent); }
.alert.warn { background: var(--warn-soft); border: 1px solid color-mix(in srgb, var(--ok) 35%, transparent); }
.alert.info { background: var(--accent-soft); }
.alert-title { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 14px; }
.alert.urgent .alert-title { color: var(--bad); }
.alert.warn .alert-title { color: var(--ok); }
.alert.info .alert-title { color: var(--accent-strong); }
.alert p { font-size: 13px; }
.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; padding: 0; white-space: nowrap; }
.pill::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
.pill.good { color: var(--good); }
.pill.perfect { color: var(--perfect); }
.pill.fine { color: var(--fine); }
.pill.ok { color: var(--ok); }
.pill.bad { color: var(--bad); }

/* score ring */
.hero { display: grid; grid-template-columns: auto 1fr; gap: 18px; align-items: center; }
.ring { position: relative; width: 132px; height: 132px; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }

/* calendar */
.cal-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }

/* tab bar */

<body>

<div class="phone" id="phone">
  <main class="screen" id="screen" aria-live="polite"></main>
  <nav class="tabbar" aria-label="主导航">
    <button class="tab" data-nav="home" aria-current="page"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"/><path d="M3 10a2 2 0 0 1 .709-1.528l7-5.999a2 2 0 0 1 2.582 0l7 5.999A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>首页</button>
    <button class="fab" data-nav="record" aria-label="拍照记录"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></svg></button>
    <button class="tab" data-nav="calendar"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 2v4"/><path d="M16 2v4"/><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M3 10h18"/><path d="M8 14h.01"/><path d="M12 14h.01"/><path d="M16 14h.01"/><path d="M8 18h.01"/><path d="M12 18h.01"/><path d="M16 18h.01"/></svg>日历</button>
  </nav>
</div>

<script>
(function () {
  "use strict";

  /* ---------- scoring model ---------- */
  var COLORS = {
    brown:  { name: "棕色",   hex: "#7A4A26", pts: 25, note: "健康的正常颜色" },
    yellow: { name: "黄色",   hex: "#C99A2E", pts: 18, note: "可能与高脂饮食或肠道通过较快有关" },
    green:  { name: "绿色",   hex: "#5F7B2C", pts: 16, note: "常见于绿叶菜摄入多或肠道通过过快" },
    black:  { name: "黑色",   hex: "#241C18", pts: 4,  note: "可能提示上消化道出血；补铁剂、铋剂也会导致发黑" },
    red:    { name: "带血/红色", hex: "#A3291F", pts: 0,  note: "可能提示下消化道出血或痔疮；红心火龙果、甜菜也会染红" },
    pale:   { name: "灰白色", hex: "#D3CAB3", pts: 4,  note: "可能与胆汁排出受阻有关" }
  };
  var TYPES = [null,
    { name: "分离硬块",   tag: "严重便秘", desc: "像坚果一样一颗颗的硬块，很难排出", pts: 10 },
    { name: "块状腊肠",   tag: "轻度便秘", desc: "香肠状，但表面凹凸成块",           pts: 24 },
    { name: "有裂纹的腊肠", tag: "正常",   desc: "香肠状，表面有些裂纹",             pts: 37 },
    { name: "光滑软条",   tag: "理想",     desc: "像香蕉一样光滑、柔软",             pts: 40 },
    { name: "软团块",     tag: "偏软",     desc: "边缘清楚的软块，很容易排出",       pts: 30 },
    { name: "糊状",       tag: "轻度腹泻", desc: "边缘蓬松、不成形的糊状",           pts: 16 },
    { name: "水样",       tag: "腹泻",     desc: "完全是液体，没有固体",             pts: 6 }
  ];
  var EFFORT = {
    easy:  { name: "很轻松",   pts: 20, icon: "smile" },
    normal:{ name: "还行",     pts: 16, icon: "meh" },
    hard:  { name: "有点费劲", pts: 8,  icon: "frown" },
    vhard: { name: "非常费劲", pts: 3,  icon: "annoyed" }
  };
  var CUP_ML = 250;
  var SYMPTOMS = ["腹痛", "腹胀", "发热", "恶心呕吐", "便血", "黏液", "排不尽感"];
  var DIET = ["辛辣", "油腻", "乳制品", "酒精", "咖啡浓茶", "红心火龙果/甜菜", "高纤维"];
  var MEDS = ["铁剂", "铋剂", "益生菌", "泻药", "抗生素", "止泻药"];
  function has(r, k, v) { return (r[k] || []).indexOf(v) >= 0; }
  function goal() { return (state && state.profile && state.profile.waterGoal) || 8; }
  function waterPts(c) { var g = goal(); return c >= g ? 15 : c >= g * 0.75 ? 12 : c >= g * 0.5 ? 8 : 3; }
  function scoreOf(r) {
    // backend only: symptoms take a few points off, never shown as a rule to the user
    return Math.max(0, TYPES[r.type].pts + COLORS[r.color].pts + EFFORT[r.effort].pts + waterPts(r.water) - Math.min(12, (r.symptoms || []).length * 4));
  }
  function band(s) {
    if (s >= 95) return { label: "完美", cls: "perfect", color: "var(--perfect)", c2: "var(--perfect-2)" };
    if (s >= 80) return { label: "优秀", cls: "good", color: "var(--good)", c2: "var(--good-2)" };
    if (s >= 60) return { label: "良好", cls: "fine", color: "var(--fine)", c2: "var(--fine-2)" };
    if (s >= 40) return { label: "一般", cls: "ok", color: "var(--ok)", c2: "var(--ok-2)" };
    return { label: "需关注", cls: "bad", color: "var(--bad)", c2: "var(--bad-2)" };
  }

  /* ---------- dates ---------- */
  var WEEK = ["日", "一", "二", "三", "四", "五", "六"];
  function pad2(n) { return (n < 10 ? "0" : "") + n; }
  function dayKey(d) { return d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate()); }
  function addDays(d, n) { var x = new Date(d); x.setDate(x.getDate() + n); return x; }
  function startOfDay(d) { var x = new Date(d); x.setHours(0, 0, 0, 0); return x; }
  function fmtTime(ts) { var d = new Date(ts); return pad2(d.getHours()) + ":" + pad2(d.getMinutes()); }
  function relDay(ts) {
    var diff = Math.round((startOfDay(new Date()) - startOfDay(new Date(ts))) / 864e5);
    if (diff === 0) return "今天";
    if (diff === 1) return "昨天";
    var d = new Date(ts);
    return (d.getMonth() + 1) + "月" + d.getDate() + "日";
  }

  /* ---------- storage ---------- */
  var KEY = "shunchang.records.v1", SKEY = "shunchang.settings.v1", PKEY = "shunchang.profile.v1";
  function load(k) { try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : null; } catch (e) { return null; } }
  function save(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* storage unavailable: keep in memory */ } }

  function seedExamples() {
    var out = [], seed = 7;
    function rnd() { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; }
    var today = startOfDay(new Date());
    for (var i = 30; i >= 1; i--) {
      if (i === 12) { // one example day with diarrhoea: several trips in a day
        [[7, 40, 6, "yellow", "normal"], [10, 15, 7, "yellow", "easy"], [13, 5, 7, "yellow", "easy"], [17, 30, 6, "brown", "normal"]].forEach(function (t, k) {
          var dd = addDays(today, -i); dd.setHours(t[0], t[1]);
          out.push({ id: "ex12-" + k, ts: dd.getTime(), type: t[2], color: t[3], water: 7, effort: t[4], example: true });
        });
        continue;
      }
      if (rnd() < 0.15) continue; // a few days without a record
      var d = addDays(today, -i);
      var late = i <= 4; // the last few days drift toward constipation, to show the warning
      var type = late ? (rnd() < 0.7 ? 2 : 3) : [3, 4, 4, 4, 5, 3, 4, 6, 4, 2][Math.floor(rnd() * 10)];
      var color = late ? "brown" : (rnd() < 0.85 ? "brown" : (rnd() < 0.5 ? "yellow" : "green"));
      var water = late ? 3 + Math.floor(rnd() * 2) : 5 + Math.floor(rnd() * 4);
      var effort = late ? (rnd() < 0.6 ? "hard" : "vhard") : (type === 4 || type === 3 ? (rnd() < 0.6 ? "easy" : "normal") : "normal");
      d.setHours(7 + Math.floor(rnd() * 3), Math.floor(rnd() * 60));
      out.push({ id: "ex" + i, ts: d.getTime(), type: type, color: color, water: water, effort: effort, example: true });
    }
    return out;
  }

  var stored = load(KEY);
  var state = {
    records: stored || seedExamples(),
    settings: Object.assign({ daily: true, dailyTime: "08:30", water: true, noBm: true, weekly: true, blur: true, healthRead: false, healthWrite: false, onboarded: false }, load(SKEY) || {}),
    profile: load(PKEY) || { loggedIn: false, phone: "", via: "", name: "", gender: "", birthYear: "", waterGoal: 8 },
    login: { phone: "", code: "", agree: false, countdown: 0 },
    confirmClear: false,
    range: "week",
    reportRange: "week",
    prevView: "home",

  document.addEventListener("click", function (e) {
    if (suppressClick) { e.preventDefault(); return; }
    var el = e.target.closest("[data-nav],[data-action],[data-color],[data-type],[data-water],[data-effort],[data-day],[data-gender],[data-bgender],[data-tag],[data-rec],[data-doc]");
    if (!el || el.disabled) return;
    var d = state.draft;
    if (el.hasAttribute("data-nav")) return go(el.getAttribute("data-nav"));
    if (el.hasAttribute("data-color")) { d.color = el.getAttribute("data-color"); return render(true); }
    if (el.hasAttribute("data-type")) { d.type = Number(el.getAttribute("data-type")); return render(true); }
    if (el.hasAttribute("data-water")) { var w = Number(el.getAttribute("data-water")); d.water = d.water === w ? w - 1 : w; return render(true); }
    if (el.hasAttribute("data-effort")) { d.effort = el.getAttribute("data-effort"); return render(true); }
    if (el.hasAttribute("data-day")) { state.selDay = el.getAttribute("data-day"); return render(true); }
    if (el.hasAttribute("data-tag")) {
      var kv = el.getAttribute("data-tag").split("|"), arr = d[kv[0]], ix = arr.indexOf(kv[1]);
      if (ix >= 0) arr.splice(ix, 1); else arr.push(kv[1]);
      return render(true);
    }
    if (el.hasAttribute("data-rec")) {
      if (state.view !== "result") state.prevView = state.view;
      state.lastId = el.getAttribute("data-rec"); state.fromSubmit = false; state.confirmDel = false; state.view = "result";
      return render(false);
    }
    if (el.hasAttribute("data-doc")) {
      e.preventDefault();
      state.docBack = state.view; state.doc = el.getAttribute("data-doc"); state.view = "doc";
      return render(false);
    }
    if (el.hasAttribute("data-bgender")) {
      state.basic.gender = el.getAttribute("data-bgender"); state.basic.touched = true;
      var sv = Array.prototype.map.call(document.querySelectorAll(".wheel"), function (w) { return w.scrollTop; });
      render(true);
      document.querySelectorAll(".wheel").forEach(function (w, i) { w.scrollTop = sv[i]; });
      return;
    }
    if (el.hasAttribute("data-gender")) { state.profile.gender = el.getAttribute("data-gender"); saveProfile(); return render(true); }
    switch (el.getAttribute("data-action")) {
      case "sample": samplePhoto(); break;
      case "water-minus": d.water = Math.max(0, d.water - 1); render(true); break;
      case "water-plus": d.water = Math.min(20, d.water + 1); render(true); break;
      case "peek": state.peek = !state.peek; render(true); break;
      case "rec-back":
        if (state.draft && state.draft.editId) { state.lastId = state.draft.editId; state.view = "result"; state.draft = null; render(false); }
        else go(state.prevView === "calendar" ? "calendar" : "home");
        break;
      case "back":
        if (state.view === "doc") { state.view = state.docBack || "settings"; render(false); }
        else if (state.view === "report") { state.view = state.reportBack || "home"; render(false); }
        else go(state.prevView === "calendar" ? "calendar" : "home");
        break;
      case "edit-rec":
        var er = state.records.filter(function (r) { return r.id === state.lastId; })[0];
        if (er) { state.draft = newDraft(er); state.confirmDel = false; state.view = "record"; render(false); }
        break;
      case "del-ask": state.confirmDel = true; render(true); break;
      case "del-cancel": state.confirmDel = false; render(true); break;
      case "del-confirm": deleteCurrent(); break;
      case "report-week": case "report-month":
        if (state.view !== "report") state.reportBack = state.view;
        state.reportRange = el.getAttribute("data-action") === "report-week" ? "week" : "month";
        state.reportText = null; state.view = "report"; render(state.view === "report" && el.closest(".segctl") ? true : false); break;
      case "copy-report":
        var txt = reportPlain();
        try {
          navigator.clipboard.writeText(txt).then(function () { toast("报告已复制，可以粘贴发给医生"); }, function () { state.reportText = txt; render(true); });
        } catch (err) { state.reportText = txt; render(true); }
        break;
      case "onb-next": onbGo(1); break;
      case "onb-done": finishOnb(false); break;
      case "onb-notify": finishOnb(true); break;
      case "onb-replay": state.onb = 0; state.basic = basicFromProfile(); render(true); break;
      case "onb-basic-save": state.basic.touched = true; onbGo(1); toast("已保存，可在「我的」里修改"); break;
      case "acct-ask": state.confirmAcct = true; render(true); break;
      case "acct-cancel": state.confirmAcct = false; render(true); break;
      case "acct-confirm":
        state.records = []; persist();
        state.profile = { loggedIn: false, phone: "", via: "", name: "", gender: "", waterGoal: 8 }; saveProfile();
        state.confirmAcct = false; render(false); toast("账号已注销，数据已删除"); break;
      case "submit": submit(); break;
      case "clear-examples":
        state.records = state.records.filter(function (r) { return !r.example; });
        persist(); render(true); toast("示例数据已清除"); break;
      case "range-week": state.range = "week"; render(true); break;
      case "range-month": state.range = "month"; render(true); break;
      case "send-code": sendCode(); break;
      case "login": loginPhone(); break;
      case "login-wechat": loginVia("微信"); break;
      case "login-apple": loginVia("Apple"); break;
      case "logout": state.profile.loggedIn = false; state.profile.phone = ""; state.profile.via = ""; saveProfile(); render(true); toast("已退出登录"); break;
      case "goal-minus": state.profile.waterGoal = Math.max(4, goal() - 1); state.profile.goalAuto = false; saveProfile(); render(true); break;
      case "goal-plus": state.profile.waterGoal = Math.min(16, goal() + 1); state.profile.goalAuto = false; saveProfile(); render(true); break;
      case "clear-ask": state.confirmClear = true; render(true); break;
      case "clear-cancel": state.confirmClear = false; render(true); break;
      case "clear-all": state.records = []; persist(); state.confirmClear = false; render(true); toast("全部记录已删除"); break;
      case "prev-month": state.calMonth = new Date(state.calMonth.getFullYear(), state.calMonth.getMonth() - 1, 1); state.selDay = null; render(true); break;
      case "next-month": state.calMonth = new Date(state.calMonth.getFullYear(), state.calMonth.getMonth() + 1, 1); state.selDay = null; render(true); break;
    }
  });
  document.addEventListener("change", function (e) {
    var id = e.target.id, st = state.settings;
    if (id === "daily-on") { st.daily = e.target.checked; toast(st.daily ? "每天 " + st.dailyTime + " 提醒你记录" : "已关闭每日提醒"); }
    else if (id === "water-on") { st.water = e.target.checked; toast(st.water ? "已开启喝水提醒" : "已关闭喝水提醒"); }
    else if (id === "daily-time") { st.dailyTime = e.target.value || "08:30"; toast("提醒时间改为 " + st.dailyTime); }
    else if (id === "pf-name") { state.profile.name = e.target.value.trim(); saveProfile(); toast("昵称已保存"); return; }
    else if (id === "login-agree") { state.login.agree = e.target.checked; return; }
    else if (id === "rec-time") {
      var v = new Date(e.target.value).getTime(), min = addDays(startOfDay(new Date()), -7).getTime();
      if (!isNaN(v)) { state.draft.ts = Math.min(Date.now(), Math.max(min, v)); render(true); }
      return;
    }
    else if (id === "nobm-on") { st.noBm = e.target.checked; toast(st.noBm ? "已开启多日未排便提醒" : "已关闭多日未排便提醒"); }
    else if (id === "weekly-on") { st.weekly = e.target.checked; toast(st.weekly ? "每周一推送周报" : "已关闭周报推送"); }
    else if (id === "blur-on") { st.blur = e.target.checked; toast(st.blur ? "拍照预览会自动模糊" : "已关闭自动模糊"); }
    else if (id === "hread-on") { st.healthRead = e.target.checked; toast(st.healthRead ? "已授权读取喝水量（演示）" : "已停止读取健康数据"); }
    else if (id === "hwrite-on") { st.healthWrite = e.target.checked; toast(st.healthWrite ? "记录会写入健康 App（演示）" : "已停止写入健康 App"); }
    else return;
    save(SKEY, st);
  });
  document.addEventListener("input", function (e) {
    if (e.target.id === "onb-name") { state.basic.name = e.target.value.trim(); state.basic.touched = true; }
    if (e.target.id === "login-phone") state.login.phone = e.target.value.replace(/\D/g, "");
    if (e.target.id === "login-code") state.login.code = e.target.value.replace(/\D/g, "");
  });

  /* ---------- login (demo: no real SMS is sent) ---------- */
  function saveProfile() { save(PKEY, state.profile); }
  function loginError(msg) {
    var el = document.getElementById("login-err");
    if (el) { el.textContent = msg; el.hidden = !msg; }
  }
  function sendCode() {
    var L = state.login;
    if (!/^1\d{10}$/.test(L.phone)) return loginError("请输入 11 位手机号");
    loginError("");
    L.countdown = 60;
    toast("验证码已发送（演示）");
    var t = setInterval(function () {
      L.countdown--;
      var b = document.getElementById("send-code");
      if (b) { b.disabled = L.countdown > 0; b.textContent = L.countdown > 0 ? L.countdown + " 秒后重发" : "获取验证码"; }
      if (L.countdown <= 0) clearInterval(t);
    }, 1000);
    var b0 = document.getElementById("send-code");
    if (b0) { b0.disabled = true; b0.textContent = "60 秒后重发"; }
  }
  function finishLogin(via, phoneNum) {
    var p = state.profile;
    p.loggedIn = true; p.via = via; p.phone = phoneNum || "";
    if (!p.name) p.name = via === "手机" ? "用户" + phoneNum.slice(-4) : via + "用户";
    saveProfile();
    state.login = { phone: "", code: "", agree: false, countdown: 0 };
    render(false);
    toast("登录成功");
  }
  function loginPhone() {
    var L = state.login;
    if (!/^1\d{10}$/.test(L.phone)) return loginError("请输入 11 位手机号");
    if (!/^\d{6}$/.test(L.code)) return loginError("请输入 6 位验证码");
    if (!L.agree) return loginError("请先勾选同意用户协议和隐私政策");
    finishLogin("手机", L.phone);
  }
  function loginVia(via) {
    if (!state.login.agree) return loginError("请先勾选同意用户协议和隐私政策");
    finishLogin(via, "");
  }

  state.basic = basicFromProfile();
  state.setBasic = basicFromProfile();
  render(false);
})();
</script>
</body>
</html>
