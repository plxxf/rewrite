<style>
/* Layout: a single phone-shaped app shell (full-bleed on phones, framed on desktop) with a scrolling screen and a bottom tab bar. */
:root {
  --bg: #E9E9EC;
  --frame: #F5F5F7;
  --surface: #FFFFFF;
  --fill: #F0F0F2;
  --seg-on: #FFFFFF;
  --ink: #141416;
  --muted: #85858C;
  --line: #E8E8EC;
  --btn: #141416;
  --btn-ink: #FFFFFF;
  --accent: #EBA437;
  --accent-2: #F6C875;
  --accent-strong: #94590A;
  --accent-ink: #2A1A00;
  --accent-soft: #FBF1E0;
  --perfect: #5E5CE6; --perfect-2: #A3A1F7;
  --good: #3F7CF6; --good-2: #8FB4FF;
  --fine: #3AA8DC; --fine-2: #93D6F3;
  --ok: #EE963A; --ok-2: #F8C788;
  --bad: #E5484D; --bad-2: #F49A9D;
  --bad-soft: #FDEEEE;
  --warn-soft: #FDF4E8;
  --card-shadow: 0 1px 2px rgba(20, 20, 22, .04), 0 4px 14px rgba(20, 20, 22, .04);
  --stool: #7A4A26;
  --shadow: 0 20px 60px rgba(0, 0, 0, .14);
  --f-display: -apple-system, "SF Pro Display", "SF Pro Rounded", system-ui, "PingFang SC", "Noto Sans SC", sans-serif;
  --f-body: -apple-system, "SF Pro Text", system-ui, "PingFang SC", "Noto Sans SC", "Microsoft YaHei", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0A0A0B; --frame: #000000; --surface: #18181B; --fill: #26262A; --seg-on: #55555C; --ink: #F5F5F7; --muted: #8C8C94;
    --line: #2A2A2F; --btn: #F5F5F7; --btn-ink: #111113; --accent: #F2B04E; --accent-2: #F8D08E; --accent-strong: #F6C474; --accent-ink: #2A1A00; --accent-soft: #2E2210;
    --perfect: #7D7AFF; --perfect-2: #B7B5FF; --good: #4D8DFF; --good-2: #9DC0FF; --fine: #5AC8FA; --fine-2: #A9E4FC; --ok: #FFA552; --ok-2: #FFD3A0; --bad: #FF5F5F; --bad-2: #FFA3A3;
    --bad-soft: #351A1A; --warn-soft: #33250F; --card-shadow: none;
    --stool: #B27B4F; --shadow: 0 20px 60px rgba(0, 0, 0, .6); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0A0A0B; --frame: #000000; --surface: #18181B; --fill: #26262A; --seg-on: #55555C; --ink: #F5F5F7; --muted: #8C8C94;
    --line: #2A2A2F; --btn: #F5F5F7; --btn-ink: #111113; --accent: #F2B04E; --accent-2: #F8D08E; --accent-strong: #F6C474; --accent-ink: #2A1A00; --accent-soft: #2E2210;
    --perfect: #7D7AFF; --perfect-2: #B7B5FF; --good: #4D8DFF; --good-2: #9DC0FF; --fine: #5AC8FA; --fine-2: #A9E4FC; --ok: #FFA552; --ok-2: #FFD3A0; --bad: #FF5F5F; --bad-2: #FFA3A3;
    --bad-soft: #351A1A; --warn-soft: #33250F; --card-shadow: none;
  --stool: #B27B4F; --shadow: 0 20px 60px rgba(0, 0, 0, .6); color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.55;
  display: flex; justify-content: center; align-items: center; overflow: hidden;
}
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.phone {
  position: relative; display: flex; flex-direction: column; width: 100%; height: 100%;
  background: var(--frame); overflow: hidden;
}
@media (min-width: 560px) {
  .phone { width: 400px; height: min(840px, calc(100% - 40px)); border-radius: 40px; border: 1px solid var(--line); box-shadow: var(--shadow); }
}
.screen { flex: 1; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; }
.pad {
  display: flex; flex-direction: column; gap: 14px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 18px 110px;
}

/* type */
h1, h2, h3, p { margin: 0; }
h1 { font-size: 24px; font-weight: 700; text-wrap: balance; letter-spacing: -.01em; }
h2 { font-size: 15px; font-weight: 700; }
.eyebrow { font-size: 12px; color: var(--muted); letter-spacing: .06em; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.num { font-family: var(--f-display); font-variant-numeric: tabular-nums; }

.hello { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; }
.brand { font-family: var(--f-display); font-weight: 800; font-size: 13px; letter-spacing: .08em; color: var(--accent-strong); display: inline-flex; align-items: center; gap: 6px; }
.brand svg { width: 22px; height: 22px; }

.card { background: var(--surface); box-shadow: var(--card-shadow); border-radius: 18px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.card-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.link { background: none; border: 0; padding: 0; color: var(--accent-strong); font-size: 13px; font-weight: 500; }

/* apple-health-like grouping */
.pad.home { gap: 26px; }
.group { display: flex; flex-direction: column; gap: 8px; }
.sec-title { display: flex; justify-content: space-between; align-items: baseline; padding: 0 4px; }
.sec-title h2 { font-size: 21px; font-weight: 700; letter-spacing: -.01em; }
.hello h1 { font-size: 28px; line-height: 1.25; letter-spacing: -.02em; }
.cap { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 13px; }
.cap-label { color: var(--accent-strong); font-weight: 600; display: inline-flex; gap: 6px; align-items: center; }
.cap-label svg { width: 16px; height: 16px; }
.cap .chev { color: var(--muted); display: inline-flex; align-items: center; gap: 2px; background: none; border: 0; padding: 0; font-size: 13px; }
.kpi { display: flex; align-items: baseline; gap: 3px; }
.kpi-num { font-family: var(--f-display); font-size: 34px; font-weight: 700; letter-spacing: -.02em; line-height: 1.1; font-variant-numeric: tabular-nums; }
.kpi-unit { font-size: 15px; color: var(--muted); font-weight: 600; }
.score-row { display: grid; grid-template-columns: auto 1fr; gap: 18px; align-items: center; }
.score-text { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.ring.xl { width: 184px; height: 184px; }
.ring.xl .big { font-size: 60px; }
.ring .of { font-size: 12px; font-weight: 600; }
.contribs { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 16px; padding-top: 4px; border-top: 1px solid var(--line); padding-block: 14px 2px; }
.contribs.full { grid-template-columns: 1fr; }
.contrib { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.c-top { display: flex; justify-content: space-between; align-items: baseline; gap: 6px; font-size: 14px; font-weight: 600; }
.c-lvl { font-size: 12px; font-weight: 500; color: var(--muted); }
.c-w { font-size: 11px; font-weight: 400; color: var(--muted); }
.c-bar { height: 6px; border-radius: 999px; background: var(--fill); overflow: hidden; }
.c-bar i { display: block; height: 100%; border-radius: inherit; }
.c-sub { display: flex; justify-content: space-between; gap: 6px; font-size: 12px; color: var(--muted); }
.c-sub span:first-child { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.segctl { display: grid; grid-template-columns: 1fr 1fr; background: var(--fill); border-radius: 9px; padding: 2px; }
.segctl button { border: 0; background: none; border-radius: 7px; padding: 5px 0; font-size: 13px; font-weight: 600; }
.segctl button[aria-selected="true"] { background: var(--seg-on); box-shadow: 0 1px 3px rgba(0,0,0,.14); }
.lchart { width: 100%; height: auto; display: block; overflow: visible; }
.lchart .grid { stroke: var(--line); stroke-width: 1; }
.lchart .ax { fill: var(--muted); font-size: 10px; font-family: var(--f-body); }
.lchart .line { fill: none; stroke: var(--good); stroke-width: 2.2; stroke-linejoin: round; stroke-linecap: round; }
.lchart .area { fill: var(--good); opacity: .1; }
.lchart .avg { stroke: var(--muted); stroke-dasharray: 3 3; stroke-width: 1; }
.lchart .dot { stroke: var(--surface); stroke-width: 1.5; }
.warn-line { display: flex; gap: 6px; align-items: flex-start; color: var(--ok); margin-top: 4px; }
.warn-line .ic { width: 15px; height: 15px; margin-top: 3px; }
.warn-line.strong { font-weight: 600; }
.goal-eval { display: flex; flex-direction: column; gap: 4px; background: var(--fill); border-radius: 12px; padding: 10px 12px; }
.badge-hero { flex-direction: row; align-items: center; gap: 16px; }
.medal.xl { width: 72px; height: 72px; border-radius: 50%; display: grid; place-items: center; flex: none; background: linear-gradient(145deg, var(--accent-2), var(--accent)); color: var(--accent-ink); box-shadow: 0 8px 22px color-mix(in srgb, var(--accent) 40%, transparent); }
.medal.xl .ic { width: 34px; height: 34px; }
.badge-list { display: flex; flex-direction: column; }
.badge-item { display: flex; gap: 12px; align-items: flex-start; padding: 12px 0; border-top: 1px solid var(--line); }
.badge-item:first-child { border-top: 0; padding-top: 0; }
.badge-item .medal { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; flex: none; background: var(--fill); color: var(--muted); }
.badge-item .medal .ic { width: 20px; height: 20px; }
.badge-item.on .medal { background: linear-gradient(145deg, var(--accent-2), var(--accent)); color: var(--accent-ink); }
.badge-item .grow { display: flex; flex-direction: column; gap: 4px; }
.bi-top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; font-size: 15px; }
.bi-state { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 600; color: var(--accent-strong); }
.bi-state .ic { width: 14px; height: 14px; }
.celebrate { position: absolute; inset: 0; z-index: 50; display: grid; place-items: center; padding: 24px; background: rgba(0, 0, 0, .45); backdrop-filter: blur(4px); animation: celeFade .25s ease both; }
.cele-card { position: relative; width: 100%; max-width: 320px; background: var(--surface); border-radius: 24px; padding: 28px 20px 20px; display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; animation: celePop .45s cubic-bezier(.2, 1.3, .4, 1) both; }
.cele-card h2 { font-size: 22px; }
.cele-card .row-btns { width: 100%; margin-top: 10px; }
.cele-card .medal.xl { width: 92px; height: 92px; margin-bottom: 14px; }
.cele-card .medal.xl .ic { width: 42px; height: 42px; }
.cele-burst { position: absolute; top: 28px; left: 50%; width: 92px; height: 92px; transform: translateX(-50%); pointer-events: none; }
.cele-burst i { position: absolute; inset: 0; border-radius: 50%; border: 2px solid var(--accent); opacity: 0; animation: celeRing 1.6s ease-out infinite; }
.cele-burst i:nth-child(2) { animation-delay: .4s; }
.cele-burst i:nth-child(3) { animation-delay: .8s; }
@keyframes celeFade { from { opacity: 0; } }
@keyframes celePop { from { transform: scale(.8); opacity: 0; } }
@keyframes celeRing { 0% { transform: scale(1); opacity: .6; } 100% { transform: scale(1.9); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .celebrate, .cele-card, .cele-burst i { animation: none; } }
.wheel-note { font-size: 11px; color: var(--muted); text-align: center; }
.wheel.bump { animation: wheelBump .35s ease; }
@keyframes wheelBump { 30% { transform: translateY(6px); } }
@media (prefers-reduced-motion: reduce) { .wheel.bump { animation: none; } }
.block-line { display: flex; gap: 8px; align-items: flex-start; color: var(--bad); line-height: 1.6; }
.block-line .ic { width: 16px; height: 16px; margin-top: 4px; }
.guardian { display: flex; gap: 8px; align-items: flex-start; margin-top: 6px; font-size: 13px; color: var(--ink); }
.guardian input { margin: 3px 0 0; accent-color: var(--accent); width: 16px; height: 16px; }
.login-step { justify-content: center; gap: 18px; }
.login-head { display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; }
.art-circle.sm { width: 84px; height: 84px; }
.art-circle.sm svg { width: 40px; height: 40px; }
.login-btns { display: flex; flex-direction: column; gap: 10px; }
.login-btns .btn { gap: 10px; }
.btn.login-apple { background: #000; color: #fff; }
:root[data-theme="dark"] .btn.login-apple { background: #fff; color: #000; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .btn.login-apple { background: #fff; color: #000; } }
.phone-form { display: flex; flex-direction: column; gap: 10px; }
.data-rows { display: flex; flex-direction: column; background: var(--fill); border-radius: 14px; padding: 0 12px; }
.data-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; width: 100%; background: none; border: 0; border-top: 1px solid var(--line); padding: 12px 0; font-size: 14px; text-align: left; }
.data-row:first-child { border-top: 0; }
.data-row .dv { display: inline-flex; align-items: center; gap: 4px; }
.data-row .dv b { font-family: var(--f-display); font-variant-numeric: tabular-nums; }
.data-row .dv .ic { width: 16px; height: 16px; color: var(--muted); }
.sheet { position: absolute; inset: 0; z-index: 45; display: flex; align-items: flex-end; background: rgba(0, 0, 0, .35); animation: celeFade .2s ease both; }
.sheet-card { width: 100%; background: var(--surface); border-radius: 22px 22px 0 0; padding: 14px max(16px, env(safe-area-inset-right, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 10px; animation: sheetUp .28s cubic-bezier(.2, .9, .3, 1) both; }
@keyframes sheetUp { from { transform: translateY(40px); opacity: 0; } }
.sheet-head { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; }
.sheet-head .link:last-child { justify-self: end; }
.link.strong { font-weight: 700; font-size: 15px; }
.sheet-head .link:first-child { font-size: 15px; color: var(--muted); }
.dial-value { display: flex; justify-content: center; align-items: baseline; gap: 6px; padding-top: 6px; }
.dial-value .num { font-size: 52px; font-weight: 700; letter-spacing: -.02em; line-height: 1; color: var(--accent-strong); }
.dial-unit { font-size: 17px; color: var(--muted); font-weight: 600; }
.dial-wrap { position: relative; height: 96px; margin: 0 -16px; border-top: 1px solid var(--line); background: linear-gradient(var(--fill), var(--surface)); overflow: hidden; }
.dial-wrap canvas { width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
.dial-wrap canvas:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.dial-pointer { position: absolute; left: 50%; top: 0; width: 0; height: 0; transform: translateX(-50%); border-left: 7px solid transparent; border-right: 7px solid transparent; border-top: 9px solid var(--accent); pointer-events: none; }
.dial-fine { display: flex; justify-content: center; gap: 16px; }
.dial-fine .icon-btn { width: 44px; height: 44px; border-radius: 50%; background: var(--fill); }
@media (prefers-reduced-motion: reduce) { .sheet, .sheet-card { animation: none; } }
.lang-chips { display: flex; flex-wrap: wrap; gap: 8px; }
.onb .lang-chips { margin-top: 6px; }
.save-bar { display: flex; flex-direction: column; gap: 8px; border-top: 1px solid var(--line); padding-top: 12px; }
.save-bar .hint { margin: 0; text-align: left; }
.cap-note { display: flex; gap: 8px; align-items: flex-start; text-align: left; font-size: 13px; color: var(--accent-strong); background: var(--accent-soft); border-radius: 12px; padding: 8px 12px; margin: 0; }
.cap-note .ic { width: 16px; height: 16px; margin-top: 2px; }
.today-strip { display: flex; flex-direction: column; gap: 8px; border-top: 1px solid var(--line); padding-top: 12px; }
.ts-head { display: flex; justify-content: space-between; align-items: baseline; font-size: 14px; }
.ts-list { display: flex; flex-wrap: wrap; gap: 6px; }
.ts-item { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; background: var(--fill); border-radius: 8px; padding: 3px 8px; font-variant-numeric: tabular-nums; }
.ts-item i { width: 8px; height: 8px; border-radius: 50%; }
.day .cnt { font-size: 9px; font-weight: 600; line-height: 1; color: var(--muted); }
.wcnt { font-size: 10px; color: var(--muted); line-height: 1; }
.notice { display: flex; flex-direction: column; gap: 4px; background: var(--accent-soft); border-radius: 14px; padding: 12px 14px; font-size: 13px; }
.ok-note { display: flex; gap: 10px; align-items: center; font-size: 13px; }
.ok-note svg { width: 20px; height: 20px; color: var(--good); flex: none; }

/* v0.3 additions */
.streak { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 600; color: var(--accent-strong); background: var(--accent-soft); border-radius: 999px; padding: 2px 10px; margin-top: 6px; }
button.row { background: none; border: 0; border-top: 1px solid var(--line); width: 100%; text-align: left; font: inherit; color: inherit; cursor: pointer; }
button.row:first-child { border-top: 0; }
.photo img.blurred { filter: blur(22px) saturate(.5); transform: scale(1.15); }
.peek { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); background: rgba(0,0,0,.6); color: #fff; border: 0; border-radius: 12px; padding: 8px 14px; font-size: 13px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chips .chip { padding: 6px 12px; }
.sub-h { font-size: 12px; color: var(--muted); }
.time-row { display: flex; gap: 10px; align-items: center; justify-content: space-between; }
.time-row input { border: 1px solid var(--line); background: var(--fill); border-radius: 10px; padding: 6px 8px; font-size: 14px; max-width: 58%; min-width: 0; }
.tagline { font-size: 13px; display: flex; gap: 8px; }
.tagline b { flex: none; min-width: 64px; }
.badges { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.badge { background: var(--fill); border-radius: 14px; padding: 10px 6px; text-align: center; font-size: 12px; display: flex; flex-direction: column; align-items: center; gap: 4px; }
.badge .medal { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; background: var(--line); color: var(--muted); font-weight: 800; font-size: 14px; font-family: var(--f-display); }
.badge.on .medal { background: linear-gradient(145deg, var(--accent-2), var(--accent)); color: var(--accent-ink); }
.badge:not(.on) { color: var(--muted); }
.list-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; width: 100%; background: none; border: 0; padding: 12px 0; border-top: 1px solid var(--line); font-size: 14px; text-align: left; }
.list-row:first-of-type { border-top: 0; }
.list-row.danger-text { color: var(--bad); }
.list-row svg { color: var(--muted); flex: none; }
.dist { display: flex; flex-direction: column; gap: 8px; }
.dist-row { display: grid; grid-template-columns: 84px 1fr 34px; gap: 8px; align-items: center; font-size: 12px; }
.dist-bar { height: 8px; border-radius: 999px; background: var(--fill); overflow: hidden; }
.dist-bar i { display: block; height: 100%; border-radius: inherit; }
.dist-row .num { text-align: right; }
.delta { font-size: 13px; font-weight: 600; }
.copybox { width: 100%; min-height: 160px; border: 1px solid var(--line); border-radius: 12px; background: var(--fill); padding: 10px; font-size: 12px; font-family: var(--f-body); resize: vertical; }
.doc { font-size: 14px; line-height: 1.75; display: flex; flex-direction: column; gap: 10px; }
.doc h3 { font-size: 15px; margin-top: 4px; }
.onb { position: absolute; inset: 0; z-index: 40; background: var(--frame); display: flex; flex-direction: column; gap: 16px; padding: calc(20px + env(safe-area-inset-top, 0px)) max(24px, env(safe-area-inset-right, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)) max(24px, env(safe-area-inset-left, 0px)); }
.onb-skip { align-self: flex-end; background: none; border: 0; color: var(--muted); font-size: 14px; padding: 6px 0; }
.onb-art { flex: 1; display: grid; place-items: center; min-height: 0; }
.onb h1 { font-size: 28px; }
.onb p { color: var(--muted); font-size: 15px; }
.art-circle { width: 176px; height: 176px; border-radius: 50%; background: var(--accent-soft); display: grid; place-items: center; color: var(--accent-strong); }
.art-circle svg { width: 84px; height: 84px; }
.dots { display: flex; gap: 6px; justify-content: center; }
.dots i { width: 7px; height: 7px; border-radius: 4px; background: var(--line); }
.dots i.on { background: var(--accent); width: 20px; }
.onb .legend { justify-content: center; }
.onb { touch-action: pan-y; user-select: none; -webkit-user-select: none; }
.onb-slide { flex: 1; display: flex; flex-direction: column; gap: 16px; min-height: 0; will-change: transform; }
.onb-slide.dragging { transition: none; }

ke photo and log","主导航":"Main navigation","语言":"Language","未登录时数据只保存在你的手机上；登录后会加密同步到我们位于新加坡的服务器，方便换机。":"If you don't sign in, data stays only on your phone. If you sign in, it's encrypted and synced to our servers in Singapore so you can switch phones.","Neighbor（新加坡），由公司负责个人数据保护事务。数据存储在新加坡的服务器上，跨境传输安排以正式版隐私政策为准。":"Neighbor (Singapore), which is responsible for personal data protection. Data is stored on servers in Singapore; the final privacy policy will describe cross-border transfers."},"fr":{"棕色":"Brun","最常见的颜色":"La couleur la plus courante","黄色":"Jaune","常与饮食有关，比如吃得比较油腻":"souvent lié à l'alimentation, par exemple un repas gras","绿色":"Vert","常与饮食有关，比如吃了较多绿叶菜":"souvent lié à l'alimentation, par exemple beaucoup de légumes verts","黑色":"Noir","颜色发黑需要留意；服用铁剂、铋剂或吃了深色食物也可能发黑":"Une couleur foncée mérite attention; le fer, le bismuth ou des aliments foncés peuvent aussi en être la cause","带血/红色":"Rouge / sang","颜色发红需要留意；吃了红心火龙果、甜菜等也可能发红":"Une couleur rouge mérite attention; le fruit du dragon rouge ou la betterave peuvent aussi en être la cause","灰白色":"Pâle / grise","颜色发白需要留意":"Une couleur pâle mérite attention","分离硬块":"Morceaux durs séparés","很硬":"Très dur","像坚果一样一颗颗的硬块，很难排出":"Morceaux durs comme des noix, difficiles à évacuer","块状腊肠":"Saucisse grumeleuse","偏硬":"Dur","香肠状，但表面凹凸成块":"En forme de saucisse, mais grumeleuse","有裂纹的腊肠":"Saucisse craquelée","正常":"Normal","香肠状，表面有些裂纹":"En forme de saucisse, avec quelques craquelures","光滑软条":"Lisse et molle","理想":"Idéal","像香蕉一样光滑、柔软":"Lisse et molle, comme une banane","软团块":"Morceaux mous","偏软":"Mou","边缘清楚的软块，很容易排出":"Morceaux mous aux bords nets, faciles à évacuer","糊状":"Pâteux","偏稀":"Liquide","边缘蓬松、不成形的糊状":"Morceaux floconneux, sans forme nette","水样":"Aqueux","很稀":"Très liquide","完全是液体，没有固体":"Entièrement liquide, sans morceaux solides","很轻松":"Facile","还行":"Correct","有点费劲":"Un peu d'effort","非常费劲":"Beaucoup d'effort","这是今天第":"C'est la selle no","次排便，一天次数偏多，即使这次状态不错，评分最高也只有":"aujourd'hui. C'est plus que d'habitude pour une journée : même si celle-ci semble bonne, le score est plafonné à","分。":"points.","今天早些时候有":"Vous avez eu","次稀便，这次评分最高":"selles liquides plus tôt aujourd'hui, ce score est donc plafonné à","完美":"Parfait","优秀":"Excellent","良好":"Bon","一般":"Moyen","需关注":"À surveiller","今天":"Aujourd'hui","昨天":"Hier","你记录了":"Vous avez noté ","相关用药":"un médicament en lien","相关饮食":"un aliment en lien","你记录了正在服用铁剂或铋剂，服用期间大便发黑较常见。":"Vous avez noté prendre du fer ou du bismuth. Des selles foncées sont fréquentes pendant ce traitement.","你记录了吃过红心火龙果或甜菜，这类食物可能让大便发红。":"Vous avez noté avoir mangé du fruit du dragon rouge ou de la betterave. Ces aliments peuvent colorer les selles en rouge.","如果颜色持续不退、呈柏油样，或伴随头晕乏力，请尽快就医。":"Si la couleur persiste, ressemble à du goudron, ou si vous avez des étourdissements ou de la fatigue, consultez rapidement un médecin.","建议尽快就医":"Consultez rapidement un médecin","这次记录的大便颜色为":"La couleur de selle notée est ","。":". ","。如果近期没有吃过相关食物或药物，建议尽快到医院就诊；如果同时感到头晕、乏力或腹痛，请立即就医。":". Si vous n'avez pas récemment pris d'aliments ou de médicaments en lien, consultez rapidement un médecin. En cas d'étourdissements, de faiblesse ou de douleurs abdominales, consultez immédiatement.","近 3 天记录到灰白色大便，这种颜色需要医生进一步判断，建议尽快就诊；如果同时出现皮肤或眼白发黄、尿色变深，请立即就医。":"Des selles pâles ont été notées ces 3 derniers jours. Un médecin doit évaluer cette couleur : consultez rapidement. Si votre peau ou le blanc des yeux jaunit, ou si l'urine fonce, consultez immédiatement.","记录到便血，建议就医":"Sang dans les selles noté — consultez un médecin","大便中带血的原因有很多，需要医生检查后才能判断，建议尽快到医院就诊。":"Le sang dans les selles peut avoir de nombreuses causes, que seul un médecin peut déterminer après examen. Consultez rapidement.","稀便同时发热，建议就医":"Selles liquides avec fièvre — consultez un médecin","你记录了稀便并伴有发热，请注意补充水分，并尽快就医。":"Vous avez noté des selles liquides avec de la fièvre. Buvez suffisamment et consultez rapidement un médecin.","大便带黏液":"Mucus dans les selles","如果反复出现，或同时有腹痛、便血，建议咨询医生。":"Si cela se répète, ou s'accompagne de douleurs abdominales ou de sang, parlez-en à un médecin.","你记录了正在服用泻药":"Vous avez noté prendre un laxatif","服用泻药期间大便变稀较常见。如果次数很多或腹痛明显，请咨询医生或药师。":"Des selles plus liquides sont fréquentes sous laxatif. Si elles sont très fréquentes ou s'accompagnent de douleurs abdominales, demandez conseil à un médecin ou à un pharmacien.","已经":"Aucune selle notée depuis","天没有排便记录":"jours","超过一周没有排便，建议咨询医生。":"Plus d'une semaine sans selle. Parlez-en à un médecin.","如果确实没有排便，可以多喝温水、吃些富含膳食纤维的食物，饭后散步，早上固定时间如厕。如果只是忘了记录，可以补记。":"Si vous n'êtes vraiment pas allé à la selle, buvez davantage d'eau tiède, mangez des aliments riches en fibres, marchez après les repas et allez aux toilettes à heure fixe le matin. Si vous avez seulement oublié de noter, vous pouvez l'ajouter maintenant.","今天已有":"Selles liquides aujourd'hui :","次稀便，建议就医":"— consultez un médecin","一天内多次稀便会流失较多水分，建议尽快就医，尤其是出现发热、便血、口干、尿少或头晕时。":"Plusieurs selles liquides en une journée font perdre beaucoup de liquide. Consultez rapidement, surtout en cas de fièvre, de sang dans les selles, de bouche sèche, de peu d'urine ou d'étourdissements.","今天已排便":"Selles aujourd'hui :","次，建议就医":"— consultez un médecin","今天的排便次数明显偏多，建议尽快就医，同时注意补充水分。":"Vous êtes allé à la selle bien plus souvent que d'habitude aujourd'hui. Consultez rapidement et buvez suffisamment.","次，次数偏多":"— plus que d'habitude","一天超过 3 次排便需要留意，今天的评分会因此封顶。注意补水、饮食清淡；如果明天仍然这么多，或出现腹痛、发热、便血，请就医。":"Plus de 3 selles par jour méritent attention, et le score du jour est plafonné pour cette raison. Buvez suffisamment et mangez léger. Si c'est encore aussi fréquent demain, ou en cas de douleurs abdominales, de fièvre ou de sang dans les selles, consultez un médecin.","次稀便":"","一天 3 次及以上稀便需要留意。请少量多次补充水分，饮食清淡。如果次数继续增加、超过 2 天，或出现发热、便血、口干尿少，请就医。":"3 selles liquides ou plus par jour méritent attention. Buvez souvent par petites quantités et mangez léger. Si cela augmente, dure plus de 2 jours, ou en cas de fièvre, de sang dans les selles, de bouche sèche ou de peu d'urine, consultez un médecin.","稀便已持续 3 天":"Selles liquides depuis 3 jours","连续多天记录到糊状或水样便，请注意补充水分。如果同时有发热、便血，或明显口干、尿少，请及时就医。":"Des selles pâteuses ou aqueuses ont été notées plusieurs jours de suite. Buvez suffisamment. En cas de fièvre, de sang dans les selles, de bouche très sèche ou de peu d'urine, consultez rapidement.","近期大便偏硬":"Selles dures ces derniers temps","过去 7 天里有":"Au cours des 7 derniers jours,","天大便偏硬。建议每天喝够 8 杯水、多吃蔬菜和全谷物。如果持续超过 2 周、或出现便血和体重下降，请就医。":"jours ont eu des selles dures. Essayez de boire 8 verres d'eau par jour et de manger plus de légumes et de céréales complètes. Si cela dure plus de 2 semaines, ou en cas de sang dans les selles ou de perte de poids, consultez un médecin.","连续 3 天评分偏低":"Scores bas 3 jours de suite","最近几天的记录都不太理想，建议调整饮食和作息；如果没有改善，请咨询医生。":"Les derniers jours n'ont pas été idéaux. Essayez d'ajuster votre alimentation et votre rythme; si rien ne s'améliore, parlez-en à un médecin.","评分":"Score","分，":"points, ","第":"Type ","型 ·":"·","· 喝水":"· Eau","杯":"verres ","就医时可以告诉医生：":"Lors de la consultation, vous pouvez indiquer :","情况开始的时间和持续天数":"Quand cela a commencé et depuis combien de jours","大便的颜色、形状、每天次数":"La couleur, la forme et le nombre de selles par jour","是否伴随腹痛、发热、体重下降":"S'il y a des douleurs abdominales, de la fièvre ou une perte de poids","近期饮食、服用的药物或补充剂":"Votre alimentation récente, vos médicaments ou suppléments","整理就诊参考记录":"Préparer un résumé pour le médecin","形状":"Forme","颜色":"Couleur","顺畅度":"Facilité","饮水":"Eau","每日评分走势折线图":"Graphique des scores quotidiens","早上好":"Bonjour","中午好":"Bon midi","下午好":"Bon après-midi","晚上好":"Bonsoir","，":", ","我的：登录和设置":"Moi : connexion et réglages","已连续记录":"Série :","天":"jours","今天第":"Aujourd'hui, no","次":"","最近一次":"Dernière","其中稀便":"Liquides :","今天次数偏多，今日评分最高":"Plus que d'habitude aujourd'hui; le score du jour est plafonné à","分":"pts","型":"","再记录一次":"Noter une autre","记录今天这一次":"Noter celle d'aujourd'hui","还没有记录":"Aucune donnée pour l'instant","拍一张照片，回答两个小问题，就能得到这一次的排便评分。":"Prenez une photo et répondez à deux petites questio 要上传与排便记录无关的照片或他人隐私内容。":"Notez honnêtement. Ne téléversez pas de photos sans rapport ni de contenu privé d'autrui.","服务变更":"Modifications du service","我们可能会调整或升级功能，重大变更会提前在 App 内通知。":"Nous pouvons modifier ou améliorer des fonctions. Les changements importants seront annoncés à l'avance dans l'app.","联系我们":"Nous joindre","如有疑问，可在「我的」页面反馈。":"Pour toute question, écrivez-nous depuis la page Moi.","我们收集什么":"Ce que nous recueillons","你填写的排便记录（时间、颜色、形状、喝水量、症状、饮食、用药）、账号信息（手机号或第三方账号标识）、你填写的昵称、性别、年龄、身高、体重。":"Les notes que vous saisissez (heure, couleur, forme, eau, symptômes, alimentation, médicaments), les informations de compte (numéro de téléphone ou identifiant du fournisseur de connexion), ainsi que le surnom, le genre, l'âge, la taille et le poids que vous indiquez.","照片怎么处理":"Traitement des photos","照片只在手机上用来识别颜色，识别完成后立即丢弃，不会上传，也不会保存在记录里。":"Les photos servent uniquement sur votre téléphone à détecter la couleur, puis sont supprimées aussitôt. Elles ne sont jamais téléversées ni conservées.","数据存在哪里":"Où sont stockées les données","健康 App":"App Santé","只有在你开启并授权后，我们才会读取饮水量或写入排便记录。你可以随时在设置里关闭。":"Nous lisons l'eau bue ou écrivons vos notes seulement après activation et autorisation. Vous pouvez désactiver cela à tout moment.","使用统计":"Statistiques d'utilisation","为了改进产品，我们会统计应用启动、页面访问、功能使用次数等匿名数据。统计数据不包含你的排便记录、症状、用药和身体数据。你可以在「我的 → 数据与隐私」里关闭。":"Pour améliorer l'app, nous recueillons des données anonymes comme les ouvertures, les pages vues et l'usage des fonctions. Elles n'incluent jamais vos notes, symptômes, médicaments ni données corporelles. Désactivable dans Moi → Données et confidentialité.","你的权利":"Vos droits","你可以随时清除全部记录或注销账号，注销后数据会被永久删除。":"Vous pouvez supprimer toutes vos notes ou votre compte à tout moment. La suppression du compte efface définitivement vos données.","个人信息处理者":"Responsable des données","不会做的事":"Ce que nous ne faisons jamais","我们不出售你的数据，不在 App 里接入广告，不把你的健康信息分享给广告商或数据经纪商。":"Nous ne vendons pas vos données, n'affichons pas de publicité et ne partageons pas vos renseignements de santé avec des annonceurs ou courtiers de données.","不是医疗诊断":"Pas un diagnostic médical","拉了么的评分、分析和提醒只用于日常健康记录，不能替代医生的诊断和治疗。":"Les scores, analyses et rappels de Lalema servent uniquement au suivi quotidien et ne remplacent pas le diagnostic ni le traitement d'un médecin.","出现这些情况请就医":"Consultez un médecin en cas de","便血或黑色柏油样便、灰白色大便、稀便持续超过 2 天、稀便同时发热、剧烈腹痛、超过一周没有排便、不明原因的体重下降。":"Sang dans les selles ou selles noires goudronneuses; selles pâles; selles liquides pendant plus de 2 jours; selles liquides avec fièvre; douleurs abdominales intenses; aucune selle depuis plus d'une semaine; perte de poids inexpliquée.","紧急情况":"Urgences","如果出现大量出血、晕厥、严重脱水等紧急情况，请立即拨打当地急救电话（例如美国和加拿大 911、新加坡 995）或前往急诊。":"En cas d'urgence (saignement abondant, évanouissement, déshydratation grave), composez immédiatement le numéro d'urgence local (911 au Canada et aux États-Unis, 995 à Singapour) ou rendez-vous aux urgences.","本产品不面向 14 周岁以下儿童。14 至 18 周岁的用户需在监护人同意下使用。孕妇、老人及有慢性疾病的人群，评分和提醒可能不适用，请以医生意见为准。":"Cette app n'est pas destinée aux enfants de moins de 14 ans. Les 14 à 18 ans doivent avoir le consentement d'un parent ou tuteur. Les scores et rappels peuvent ne pas convenir aux femmes enceintes, aux personnes âgées ou aux personnes atteintes de maladies chroniques; suivez l'avis de votre médecin.","更新日期：2026 年 11 月 6 日":"Dernière mise à jour : 6 novembre 2026","年龄":"Âge","岁":"ans","14 岁起":"dès 14 ans","身高":"Taille","体重":"Poids","（":" (","）":")","，单位":", unité ","本产品暂不支持 14 岁以下的用户":"Cette app n'est pas offerte aux moins de 14 ans","调整":"Modifier ","左右拖动刻度盘调整":"Faites glisser le cadran pour ajuster","，14 岁起":" (dès 14 ans)","减少":"Diminuer","增加":"Augmenter","婴儿":"Nourrisson","幼儿":"Tout-petit","儿童":"Enfant","青少年":"Adolescent","成人":"Adulte","老年人":"Aîné","偏瘦":"insuffisance pondérale","超重":"surpoids","肥胖":"obésité","身高和体重的比例":"rapport taille-poids","按你的体重估算":"Selon votre poids,","仅供参考":"À titre indicatif","未满 18 岁时，合适的喝水量和年龄、活动量关系较大，建议参考医生的建议设置。":"Avant 18 ans, la bonn semasa berjumpa doktor sahaja.","适用人群":"Siapa boleh menggunakannya","本产品面向年满 14 周岁的用户。14 至 18 周岁的用户需在监护人同意下使用。":"App ini untuk mereka berumur 14 tahun ke atas. Pengguna berumur 14 hingga 18 tahun memerlukan persetujuan ibu bapa atau penjaga.","运营方":"Pengendali","「拉了么」由 Neighbor（一家在新加坡注册的公司）运营。":"Lalema dikendalikan oleh Neighbor, sebuah syarikat berdaftar di Singapura.","服务内容":"Perkhidmatan","拉了么帮助你记录排便情况、生成评分和健康提醒。评分和提醒基于你填写的内容和照片颜色识别，仅用于日常健康管理。":"Lalema membantu anda merekod buang air besar serta memberi skor dan peringatan kesihatan. Ia berdasarkan maklumat yang anda isi dan warna yang dikesan dalam foto, untuk pengurusan kesihatan harian sahaja.","你可以使用手机号、Apple 账号或 Google 账号登录。请妥善保管账号，不要转借他人使用。":"Anda boleh log masuk dengan nombor telefon, Apple ID atau akaun Google. Jaga akaun anda dan jangan berkongsi dengan orang lain.","使用规范":"Penggunaan yang dibenarkan","请如实记录。不要上传与排便记录无关的照片或他人隐私内容。":"Sila rekod dengan jujur. Jangan muat naik foto yang tiada kaitan atau kandungan peribadi orang lain.","服务变更":"Perubahan perkhidmatan","我们可能会调整或升级功能，重大变更会提前在 App 内通知。":"Kami mungkin mengubah atau menaik taraf ciri. Perubahan besar akan dimaklumkan lebih awal dalam app.","联系我们":"Hubungi kami","如有疑问，可在「我的」页面反馈。":"Jika ada soalan, hantar maklum balas dari halaman Saya.","我们收集什么":"Apa yang kami kumpul","你填写的排便记录（时间、颜色、形状、喝水量、症状、饮食、用药）、账号信息（手机号或第三方账号标识）、你填写的昵称、性别、年龄、身高、体重。":"Rekod buang air besar yang anda isi (masa, warna, bentuk, air, simptom, makanan, ubat), maklumat akaun (nombor telefon atau ID penyedia log masuk), serta nama panggilan, jantina, umur, tinggi dan berat yang anda berikan.","照片怎么处理":"Cara foto dikendalikan","照片只在手机上用来识别颜色，识别完成后立即丢弃，不会上传，也不会保存在记录里。":"Foto hanya digunakan pada telefon anda untuk mengesan warna, kemudian dibuang serta-merta. Ia tidak pernah dimuat naik atau disimpan dalam rekod.","数据存在哪里":"Di mana data disimpan","健康 App":"App Kesihatan","只有在你开启并授权后，我们才会读取饮水量或写入排便记录。你可以随时在设置里关闭。":"Kami hanya membaca pengambilan air atau menulis rekod selepas anda men   function streak() {
    var days = byDay(), d = startOfDay(new Date()), n = 0;
    if (!days[dayKey(d)]) d = addDays(d, -1);
    while (days[dayKey(d)]) { n++; d = addDays(d, -1); }
    return n;
  }
  function badges() {
    // only the user's own records count; example data never unlocks anything
    var mine = state.records.filter(function (r) { return !r.example; }), days = {};
    mine.forEach(function (r) { var k = dayKey(new Date(r.ts)); (days[k] = days[k] || []).push(r); });
    var keys = Object.keys(days).sort(), best = 0, run = 0, prev = null, waterDays = 0, perfect = false;
    keys.forEach(function (k) {
      var d = new Date(k + "T00:00:00");
      run = prev && dayKey(addDays(prev, 1)) === k ? run + 1 : 1;
      best = Math.max(best, run); prev = d;
      var l = days[k];
      if (Math.max.apply(null, l.map(function (r) { return r.water; })) >= goal()) waterDays++;
      if (dayScore(l) >= 95) perfect = true;
    });
    var n = mine.length;
    return [
      { id: "first", name: T("第一次记录"), desc: T("完成第一次排便记录"), icon: "camera", cur: Math.min(n, 1), target: 1, unit: T("次") },

      { id: "streak30", name: T("连续 30 天"), desc: T("连续 30 天都有记录，养成习惯"), icon: "trophy", cur: Math.min(best, 30), target: 30, unit: T("天") },
      { id: "water7", name: T("喝水达标 7 天"), desc: T("累计 7 天喝水达到目标"), icon: "droplet", cur: Math.min(waterDays, 7), target: 7, unit: T("天") },
      { id: "perfect", name: T("完美的一天"), desc: T("某一天的评分达到 95 分以上"), icon: "sparkles", cur: perfect ? 1 : 0, target: 1, unit: T("天") },

        if (state.dial) { var nd = Math.round(state.dial.pos) + Number(el.getAttribute("data-dir")); if (nd < 0 && state.dial.key === "age") toast(T("本产品暂不支持 14 岁以下的用户")); dialSet(Math.max(0, Math.min(WHEELS[state.dial.key].vals.length - 1, nd)), false); }
        break;
      case "phone-open": state.login.phoneOpen = true; render(true); break;
      case "open-login": state.loginOnly = true; state.onb = LOGIN_STEP; state.onbAnim = "in-next"; render(true); state.onbAnim = ""; break;
      case "login-close": closeLogin(); break;
      case "onb-replay": state.onb = 0; state.basic = basicFromProfile(); render(true); break;
      case "onb-basic-save":
        if (!gateOk(state.basic)) break;
        if (oddity(state.basic).length && !state.basic.confirmOdd) { state.basic.confirmOdd = true; render(true); break; }
        state.basic.touched = true; state.basic.saved = true; saveBasic(state.basic); onbGo(1); toast(T("已保存，可在「我的」里修改")); break;
      case "acct-ask": state.confirmAcct = true; render(true); break;
      case "acct-cancel": state.confirmAcct = false; render(true); break;
      case "acct-confirm":
        state.records = []; persist();
        state.profile = { loggedIn: false, phone: "", via: "", name: "", gender: "", waterGoal: 8 }; saveProfile();
        state.confirmAcct = false; render(false); toast(T("账号已注销，数据已删除")); break;
      case "submit": submit(); break;
      case "clear-examples":
        state.records = state.records.filter(function (r) { return !r.example; });
        persist(); render(true); toast(T("示例数据已清除")); break;
      case "range-week": state.range = "week"; render(true); break;
      case "range-month": state.range = "month"; render(true); break;
      case "send-code": sendCode(); break;
      case "login": loginPhone(); break;
      case "login-google": loginVia("Google"); break;
      case "login-apple": loginVia("Apple"); break;
      case "logout": state.profile.loggedIn = false; state.profile.phone = ""; state.profile.via = ""; saveProfile(); render(true); toast(T("已退出登录")); break;
      case "goal-minus": state.setBasic.waterGoal = Math.max(4, state.setBasic.waterGoal - 1); state.setBasic.goalAuto = false; state.setBasic.dirty = true; render(true); break;
      case "goal-plus": state.setBasic.waterGoal = Math.min(16, state.setBasic.waterGoal + 1); state.setBasic.goalAuto = false; state.setBasic.dirty = true; render(true); break;
      case "info-save": applySettingsInfo(); break;
      case "info-discard": state.setBasic = basicFromProfile(); render(true); toast(T("已放弃修改")); break;
      case "clear-ask": state.confirmClear = true; render(true); break;
      case "clear-cancel": state.confirmClear = false; render(true); break;
      case "clear-all": state.records = []; persist(); state.confirmClear = false; render(true); toast(T("全部记录已删除")); break;
      case "prev-month": state.calMonth = new Date(state.calMonth.getFullYear(), state.calMonth.getMonth() - 1, 1); state.selDay = null; render(true); break;
      case "next-month": state.calMonth = new Date(state.calMonth.getFullYear(), state.calMonth.getMonth() + 1, 1); state.selDay = null; render(true); break;
    }
  });
  document.addEventListener("change", function (e) {
    var id = e.target.id, st = state.settings;
    if (id === "daily-on") { st.daily = e.target.checked; toast(st.daily ? T("每天 ") + st.dailyTime + T(" 提醒你记录") : T("已关闭每日提醒")); }
    else if (id === "water-on") { st.water = e.target.checked; toast(st.water ? T("已开启喝水提醒") : T("已关闭喝水提醒")); }
    else if (id === "daily-time") { st.dailyTime = e.target.value || "08:30"; toast(T("提醒时间改为 ") + st.dailyTime); }
    else if (id === "login-dial") { state.login.dial = e.target.value; return; }
    else if (id === "login-agree") { state.login.agree = e.target.checked; return; }
    else if (id === "onb-guardian") { state.basic.guardian = e.target.checked; render(true); return; }
    else if (id === "set-guardian") { state.setBasic.guardian = e.target.checked; state.setBasic.dirty = true; render(true); return; }
    else if (id === "rec-time") {
      var v = new Date(e.target.value).getTime(), min = addDays(startOfDay(new Date()), -7).getTime();
      if (!isNaN(v)) { state.draft.ts = Math.min(Date.now(), Math.max(min, v)); render(true); }
      return;
    }
    else if (id === "nobm-on") { st.noBm = e.target.checked; toast(st.noBm ? T("已开启多日未排便提醒") : T("已关闭多日未排便提醒")); }
    else if (id === "weekly-on") { st.weekly = e.target.checked; toast(st.weekly ? T("每周一推送周报") : T("已关闭周报推送")); }
    else if (id === "stats-on") { st.stats = e.target.checked; toast(st.stats ? T("已开启匿名使用统计") : T("已关闭匿名使用统计")); }
    else if (id === "blur-on") { st.blur = e.target.checked; toast(st.blur ? T("拍照预览会自动模糊") : T("已关闭自动模糊")); }
    else if (id === "hread-on") { st.healthRead = e.target.checked; toast(st.healthRead ? T("已授权读取喝水量（演示）") : T("已停止读取健康数据")); }
    else if (id === "hwrite-on") { st.healthWrite = e.target.checked; toast(st.healthWrite ? T("记录会写入健康 App（演示）") : T("已停止写入健康 App")); }
    else return;
    save(SKEY, st);
  });
  document.addEventListener("input", function (e) {
    if (e.target.id === "pf-name") { state.setBasic.name = e.target.value.trim(); state.setBasic.dirty = true; syncSaveBar(); }
    if (e.target.id === "onb-name") { state.basic.name = e.target.value.trim(); state.basic.touched = true; }
    if (e.target.id === "login-phone") state.login.phone = e.target.value.replace(/\D/g, "");
    if (e.target.id === "login-code") state.login.code = e.target.value.replace(/\D/g, "");
  });

  /* ---------- login (demo: no real SMS is sent) ---------- */
  function saveProfile() { save(PKEY, state.profile); }
  function loginError(msg) {
    var el = document.getElementById("login-err");
    if (el) { el.textContent = msg; el.hidden = !msg; }
  }
  // basic length check per region; the SMS provider does the real validation
  function phoneOk(L) {
    var d = L.dial || defaultDial(), n = L.phone || "";
    var len = { "+65": [8, 8], "+60": [9, 10], "+852": [8, 8], "+853": [8, 8], "+886": [9, 9], "+86": [11, 11], "+1": [10, 10], "+61": [9, 9], "+44": [10, 10] }[d] || [6, 15];
    return /^\d+$/.test(n) && n.length >= len[0] && n.length <= len[1];
  }
  function sendCode() {
    var L = state.login;
    if (!phoneOk(L)) return loginError(T("请输入正确的手机号"));
    loginError("");
    L.countdown = 60;
    toast(T("验证码已发送（演示）"));
    var t = setInterval(function () {
      L.countdown--;
      var b = document.getElementById("send-code");
      if (b) { b.disabled = L.countdown > 0; b.textContent = L.countdown > 0 ? L.countdown + T(" 秒后重发") : T("获取验证码"); }
      if (L.countdown <= 0) clearInterval(t);
    }, 1000);
    var b0 = document.getElementById("send-code");
    if (b0) { b0.disabled = true; b0.textContent = T("60 秒后重发"); }
  }
  function finishLogin(via, phoneNum) {
    var p = state.profile;
    p.loggedIn = true; p.via = via; p.phone = phoneNum || "";
    saveProfile();
    state.login = { phone: "", code: "", agree: false, countdown: 0 };
    toast(T("登录成功"));
    if (state.loginOnly) { closeLogin(); return; }
    if (state.onb === LOGIN_STEP) { onbGo(1); return; }
    render(false);
  }
  function closeLogin() { state.loginOnly = false; state.onb = -1; render(true); }
  function loginPhone() {
    var L = state.login;
    if (!phoneOk(L)) return loginError(T("请输入正确的手机号"));
    if (!/^\d{6}$/.test(L.code)) return loginError(T("请输入 6 位验证码"));
    if (!L.agree) return loginError(T("请先勾选同意用户协议和隐私政策"));
    finishLogin("手机", (L.dial || defaultDial()) + " " + L.phone);
  }
  function loginVia(via) {
    if (!state.login.agree) return loginError(T("请先勾选同意用户协议和隐私政策"));
    finishLogin(via, "");
  }

  state.basic = basicFromProfile();
  state.setBasic = basicFromProfile();
  claimBadges();
  document.documentElement.lang = LOCALE;
  document.title = T("拉了么");
  document.querySelector(".tabbar").setAttribute("aria-label", T("主导航"));
  document.querySelector(".fab").setAttribute("aria-label", T("拍照记录"));
  document.querySelectorAll("[data-i18n-tail]").forEach(function (el) { el.lastChild.textContent = T(el.getAttribute("data-i18n-tail")); });
  if (!ageConfirmed()) state.onb = state.settings.onboarded ? BASIC_STEP : 0;
  render(false);
})();
</script>
</body>
</html>
